<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena · Camarero</title></head>
  <body>
    <template id="camarero">
      <style>
        #root { position: absolute; inset: 0; }
        #cam-pal { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 250px; display: flex; justify-content: center; align-items: baseline; gap: 22px; perspective: 1200px; }
        #cam-pal span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 130px; line-height: 0.95; letter-spacing: -4px; color: #F7F5F2; text-shadow: 0 20px 60px rgba(5,4,6,0.7); }
        #cam-pal em { display: inline-block; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 130px; color: #F0C96F; }
        .cam-esc { position: absolute; top: 380px; width: 500px; height: 1082px; perspective: 1400px; }
        #cam-esc-a { left: 290px; }
        #cam-esc-b { left: 290px; }
        .cam-movil { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 0; border-radius: 72px; background: linear-gradient(145deg, #2a2428, #0d0b0e 40%, #1c181b); padding: 14px; box-shadow: 0 60px 120px -20px rgba(0,0,0,0.9), 0 0 0 2px rgba(217,178,92,0.35), inset 0 0 0 2px rgba(255,255,255,0.06); }
        .cam-pantalla { position: relative; width: 472px; height: 1054px; border-radius: 58px; overflow: hidden; background: #0B0A09; }
        .cam-isla { position: absolute; left: 176px; top: 18px; width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 9; }
        #cam-hoja-a { position: absolute; left: 0; top: 16px; width: 472px; }
        /* Móvil del camarero: fondo de app oscuro y la comanda REAL tal como la enseña la demo («Así le llega al camarero») */
        #cam-app { position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(110,12,43,0.55), rgba(11,10,9,1) 60%); }
        #cam-cab { position: absolute; left: 32px; right: 32px; top: 86px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-body); font-weight: 700; font-size: 26px; color: #F7F5F2; }
        #cam-cab small { font-weight: 600; font-size: 24px; color: #F0C96F; letter-spacing: 3px; }
        #cam-campana { width: 62px; height: 62px; border-radius: 50%; background: #6E0C2B; border: 2px solid #D9B25C; display: flex; align-items: center; justify-content: center; }
        #cam-aro { position: absolute; left: 378px; top: 74px; width: 62px; height: 62px; border-radius: 50%; border: 4px solid #F0C96F; opacity: 0; }
        #cam-tarjeta { position: absolute; left: 16px; top: 200px; width: 440px; border-radius: 22px; box-shadow: 0 30px 70px rgba(0,0,0,0.65), 0 0 0 3px rgba(240,201,111,0); }
        #cam-onda { position: absolute; left: 128px; top: 334px; width: 80px; height: 80px; border-radius: 50%; border: 5px solid #F0C96F; background: rgba(240,201,111,0.3); opacity: 0; }
        #cam-sello { position: absolute; left: 36px; right: 36px; top: 452px; padding: 26px 0; border-radius: 22px; background: rgba(16,185,129,0.16); border: 2px solid #10B981; text-align: center; white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 34px; color: #F7F5F2; opacity: 0; }
        #cam-sello b { color: #10B981; }
        .cam-linea { position: absolute; left: 36px; right: 36px; height: 96px; border-radius: 20px; background: rgba(247,245,242,0.05); border: 1px solid rgba(247,245,242,0.08); }
      </style>

      <div id="root" data-composition-id="camarero" data-width="1080" data-height="1920">
        <div id="cam-pal" data-layout-allow-occlusion><span>Al</span><em>momento</em></div>
        <div class="cam-esc" id="cam-esc-a">
          <div class="cam-movil" id="cam-movil-a">
            <div class="cam-pantalla">
              <img id="cam-hoja-a" src="assets/capturas/pedido.jpg" alt="" />
              <div class="cam-isla"></div>
            </div>
          </div>
        </div>
        <div class="cam-esc" id="cam-esc-b">
          <div class="cam-movil" id="cam-movil-b">
            <div class="cam-pantalla">
              <div id="cam-app"></div>
              <div id="cam-cab"><div><small>CAMARERO</small><br />Pedidos</div><div id="cam-campana"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F0C96F" stroke-width="2.2" stroke-linecap="round"><path d="M12 4a7 7 0 0 0-7 7v3h14v-3a7 7 0 0 0-7-7ZM3 17h18M12 2v2" /></svg></div></div>
              <div id="cam-aro"></div>
              <div class="cam-linea" style="top: 640px"></div>
              <div class="cam-linea" style="top: 752px"></div>
              <div class="cam-linea" style="top: 864px"></div>
              <img id="cam-tarjeta" src="assets/capturas/camarero.png" alt="" />
              <div id="cam-onda"></div>
              <div id="cam-sello"><b>✓</b> En cocina · Mesa 4</div>
              <div class="cam-isla"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // El móvil del comensal se aparta hacia la izquierda y al fondo; entra el del camarero (push lateral motivado)
        tl.fromTo("#cam-movil-a", { x: 0, rotationY: -6, rotationX: 3, scale: 0.9, opacity: 1 }, { x: -250, rotationY: 22, rotationX: 4, scale: 0.72, opacity: 0.55, duration: 0.6, ease: "power3.inOut" }, 0);
        tl.fromTo("#cam-movil-b", { x: 620, rotationY: -35, scale: 0.8 }, { x: 150, rotationY: -12, scale: 0.86, duration: 0.6, ease: "power3.out" }, 0.05);
        tl.to("#cam-movil-b", { x: 120, rotationY: -6, scale: 0.88, duration: 2.5, ease: "sine.inOut" }, 0.65);
        tl.fromTo("#cam-pal span, #cam-pal em", { y: 40, rotationX: -75, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.5, ease: "back.out(1.5)", stagger: 0.14 }, 0.1);
        // Llega la comanda: cae desde arriba, vibra el móvil y suena la campana
        tl.fromTo("#cam-tarjeta", { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, 0.45);
        tl.fromTo("#cam-movil-b", { rotation: 0 }, { rotation: 1.6, duration: 0.05, ease: "none", yoyo: true, repeat: 9 }, 0.9);
        tl.fromTo("#cam-aro", { scale: 1, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.9);
        tl.fromTo("#cam-campana", { rotation: -18 }, { rotation: 18, duration: 0.08, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.9);
        // Un toque en «Confirmar»
        tl.fromTo("#cam-onda", { scale: 0.3, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out" }, 1.9);
        tl.fromTo("#cam-tarjeta", { scale: 1 }, { scale: 0.97, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 1.9);
        tl.fromTo("#cam-sello", { y: 30, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 2.1);
        tl.to("#cam-pal", { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.9);
        window.__timelines["camarero"] = tl;
      </script>
    </template>
  </body>
</html>
