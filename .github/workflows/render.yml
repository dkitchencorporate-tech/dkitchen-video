# Renderizado de piezas (HyperFrames + OpenMontage) con generación de audio ElevenLabs y QC estricto
# DKitchen Studio - Calidad Gran Reserva
name: Renderizar reel
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: Carpeta de la pieza (contiene composicion o MasterPiece)
        required: true
        default: reels/v1-la-carta-en-llamas
      motor:
        description: 'Motor de renderizado (remotion | hyperframes_legacy)'
        required: false
        default: 'remotion'
      fps:
        description: Fotogramas por segundo (estándar DKitchen = 30)
        required: false
        default: '30'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx libgl1-mesa-dri mesa-utils xvfb
          npm i playwright ffmpeg-static @elevenlabs/elevenlabs-js
          npx playwright install --with-deps chromium
          pip install google-api-python-client google-auth
          npm --prefix remotion-composer install

      - name: Validar y Sanitizar Parámetros de Entrada (S9)
        env:
          INPUT_CARPETA: ${{ inputs.carpeta }}
          INPUT_FPS: ${{ inputs.fps }}
          INPUT_MOTOR: ${{ inputs.motor }}
        run: |
          if [[ ! "$INPUT_CARPETA" =~ ^reels/[a-z0-9-]+$ ]]; then
            echo "[ERROR FATAL S9] La carpeta '$INPUT_CARPETA' no cumple con el patrón seguro ^reels/[a-z0-9-]+$"
            exit 1
          fi
          if [[ ! "$INPUT_FPS" =~ ^(24|30|60)$ ]]; then
            echo "[ERROR FATAL S9] Los FPS '$INPUT_FPS' deben ser 24, 30 o 60."
            exit 1
          fi

      - name: Generar Audio con ElevenLabs (Voz de Marca y Música)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TARGET_CARPETA: ${{ inputs.carpeta }}
        run: |
          if [ -f "$TARGET_CARPETA/audio.mp3" ]; then
            echo "[Audio] Pista de audio ya existente en $TARGET_CARPETA. Conservando master."
          elif [ -f "scripts/generar_audio_envolvente.cjs" ]; then
            node scripts/generar_audio_envolvente.cjs "$TARGET_CARPETA"
          elif [ -f "scripts/generar_audio_pieza.cjs" ]; then
            node scripts/generar_audio_pieza.cjs "$TARGET_CARPETA"
          else
            echo "[AVISO] No se encontró script de generación de audio. Saltando generación de voz."
          fi

      - name: Renderizar vídeo y generar Control de Calidad
        env:
          TARGET_CARPETA: ${{ inputs.carpeta }}
          TARGET_FPS: ${{ inputs.fps }}
          TARGET_MOTOR: ${{ inputs.motor }}
        run: |
          if [ "$TARGET_MOTOR" = "remotion" ] || [ "$TARGET_CARPETA" = "reels/v1-la-carta-en-llamas" ]; then
            echo "[Motor] Ejecutando Remotion + Three.js WebGL (Opción A)..."
            node scripts/render_remotion.cjs "$TARGET_CARPETA" "$TARGET_FPS"
          else
            echo "[Motor] Ejecutando renderizado alternativo..."
            node renderizar.cjs "$TARGET_CARPETA" "$TARGET_FPS"
          fi

      - name: Entregar a Google Drive (Estricto para producción)
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TARGET_CARPETA: ${{ inputs.carpeta }}
        run: python scripts/entrega_drive.py "$TARGET_CARPETA"

      - name: Guardar artefactos en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: entrega-${{ github.run_id }}
          path: |
            ${{ inputs.carpeta }}/reel.mp4
            ${{ inputs.carpeta }}/contact_sheet.jpg
            ${{ inputs.carpeta }}/control_calidad.txt