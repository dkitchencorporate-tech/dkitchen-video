<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena 1</title></head>

      <div id="root" data-composition-id="1-ticket" data-width="1080" data-height="1920">

      <script>

        tl.fromTo("#texto", { scale: 1, opacity: 1 }, { scale: 1, opacity: 1, duration: 1.5, ease: "power2.out" }, 0);
