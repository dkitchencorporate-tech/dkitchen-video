<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena · El Ticket</title></head>
  <body>
    <template id="ticket">
      <style>
        #root { position: absolute; inset: 0; }
        #tk-bg { position: absolute; inset: -40px; background-image: url('assets/capturas/inicio.jpg'); background-size: cover; background-position: center; filter: blur(22px) brightness(0.32) saturate(1.1); }
        #tk-tit { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 270px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 92px; line-height: 0.96; color: #F7F5F2; }
        #tk-tit em { font-family: 'Cormorant Garamond', serif; font-style: italic; color: #F0C96F; font-size: 108px; }
        #tk-card { position: absolute; left: 100px; right: 180px; top: 500px; border-radius: 28px; background: #FAF7F2; color: #141210; padding: 38px 36px; box-shadow: 0 50px 100px rgba(0,0,0,0.85); border-top: 10px solid #6E0C2B; }
        .tk-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 2px dashed #D6CFC7; font-family: var(--font-body); font-size: 32px; font-weight: 600; }
        .tk-row b { font-family: var(--font-display); font-size: 40px; }
        #tk-comision b { color: #D91E48; }
        #tk-neto { display: flex; justify-content: space-between; align-items: baseline; padding-top: 22px; font-family: var(--font-display); font-weight: 800; font-size: 42px; color: #141210; }
        #tk-neto b { font-size: 84px; color: #6E0C2B; font-variant-numeric: tabular-nums; }
        #tk-sello { position: absolute; left: 260px; top: 960px; padding: 16px 36px; border-radius: 18px; border: 5px solid #FF5A82; color: #FF5A82; background: rgba(15,8,12,0.92); font-family: var(--font-display); font-weight: 800; font-size: 46px; transform: rotate(-6deg); opacity: 0; }
      </style>
      <div id="root" data-composition-id="ticket" data-width="1080" data-height="1920">
        <div id="tk-bg"></div>
        <div id="tk-tit" data-layout-allow-occlusion>Pedido de <em>20,00 €</em></div>
        <div id="tk-card" data-layout-allow-occlusion>
          <div class="tk-row"><span>Total del pedido</span><b>20,00 €</b></div>
          <div class="tk-row" id="tk-comision"><span>Comisión plataforma (~30 %)*</span><b>−6,00 €</b></div>
          <div id="tk-neto"><span>Te llega a caja</span><b id="tk-val">20,00 €</b></div>
        </div>
        <div id="tk-sello" data-layout-allow-occlusion>−30 % FUERA</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const val = document.getElementById("tk-val");
        const c = { n: 20 };
        tl.fromTo("#tk-bg", { scale: 1.08 }, { scale: 1.0, duration: 3.2, ease: "sine.inOut" }, 0);
        tl.fromTo("#tk-tit", { y: 12, opacity: 1 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
        tl.fromTo("#tk-card", { y: 80, opacity: 0.25 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.05);
        tl.fromTo("#tk-comision", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.9);
        tl.fromTo("#tk-sello", { scale: 1.6, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.4, ease: "back.out(2)" }, 1.5);
        tl.to(c, { n: 14, duration: 0.8, ease: "power2.out", onUpdate: () => { val.textContent = c.n.toFixed(2).replace(".", ",") + " €"; } }, 1.5);
        tl.to("#tk-tit, #tk-card, #tk-sello", { y: -24, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.9);
        window.__timelines["ticket"] = tl;
      </script>
    </template>
  </body>
</html>
