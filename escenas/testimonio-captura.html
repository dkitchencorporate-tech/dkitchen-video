<!-- ESCENA: TESTIMONIO CAPTURA -->
<div class="escena escena-testimonio-captura" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro">
    <div style="background:#FFFFFF; padding:44px; border-radius:var(--radius-xl); box-shadow:var(--shadow-lg); border:2px solid var(--gris-suave);">
      <div style="display:flex; align-items:center; gap:20px; margin-bottom:28px;">
        <div style="width:64px; height:64px; border-radius:var(--radius-full); background:var(--vino); color:var(--oro); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:28px;">
          {{iniciales}}
        </div>
        <div>
          <div style="font-family:var(--font-display); font-size:var(--text-md); font-weight:800; color:var(--negro);">{{nombre_local}}</div>
          <div style="font-size:var(--text-xs); color:var(--gris-texto);">{{ciudad}}</div>
        </div>
      </div>
      <p style="font-family:var(--font-body); font-size:var(--text-lg); line-height:1.35; color:#292524; font-style:italic;">
        "{{cita}}"
      </p>
    </div>
  </div>
</div>
