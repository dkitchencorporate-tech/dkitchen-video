<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DKitchen · Hostelero: El Ticket · 0 % comisiones</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="marca/tokens.css" />
    <link rel="stylesheet" href="marca/fuentes.css" />
    <style>
      @font-face { font-family: 'Bricolage Grotesque'; src: url('marca/fuentes/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('marca/fuentes/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('marca/fuentes/cormorant-garamond-latin.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: block; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('marca/fuentes/cormorant-garamond-italic-latin.woff2') format('woff2'); font-weight: 300 700; font-style: italic; font-display: block; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #050406; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050406; font-family: var(--font-body); color: var(--papel); }
      #fondo { position: absolute; inset: 0; }
      .halo { position: absolute; border-radius: 50%; filter: blur(64px); }
      #halo-vino { width: 1450px; height: 1450px; left: -420px; top: -280px; background: radial-gradient(circle, rgba(110,12,43,0.88) 0%, rgba(22,14,24,0) 70%); }
      #halo-oro { width: 1150px; height: 1150px; left: 220px; top: 1020px; background: radial-gradient(circle, rgba(217,178,92,0.40) 0%, rgba(14,12,18,0) 70%); }
      #rejilla { position: absolute; inset: 0; opacity: 0.14; background-image: radial-gradient(rgba(247,245,242,0.5) 1.5px, transparent 1.5px); background-size: 36px 36px; }
      .particula { position: absolute; border-radius: 50%; background: #F0C96F; box-shadow: 0 0 12px rgba(240,201,111,0.85); }
      #camara { position: absolute; inset: 0; transform-origin: 50% 45%; }
      #subs { position: absolute; left: 75px; right: 155px; bottom: 440px; height: 215px; pointer-events: none; }
      .sub { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; gap: 6px 14px; opacity: 0; text-align: center; }
      .sub span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1.12; color: #FFFFFF; text-shadow: 0 4px 18px rgba(5,4,6,0.98), 0 0 4px rgba(5,4,6,1); }
      .sub span.oro { color: #F0C96F; }
      .sub span.dolor { color: #FF5A82; }
      .sub span.verde { color: #34D399; }
    </style>
  </head>
  <body>
    <div id="raiz" data-composition-id="lote1-r2-comision" data-start="0" data-width="1080" data-height="1920" data-duration="20">
      <div id="fondo" class="clip" data-start="0" data-duration="20" data-track-index="0" data-layout-allow-overflow>
        <div id="halo-vino" class="halo"></div>
        <div id="halo-oro" class="halo"></div>
        <div id="rejilla"></div>
        <div id="particulas"></div>
      </div>

      <div id="camara">
        <div id="hook_ticket" data-composition-id="hook_ticket" data-composition-src="compositions/hook_ticket.html"
             data-start="0" data-duration="3.8" data-track-index="1" data-width="1080" data-height="1920"></div>
        <div id="sangria_mes" data-composition-id="sangria_mes" data-composition-src="compositions/sangria_mes.html"
             data-start="3.8" data-duration="5.6" data-track-index="1" data-width="1080" data-height="1920"></div>
        <div id="tu_app_cero" data-composition-id="tu_app_cero" data-composition-src="compositions/tu_app_cero.html"
             data-start="9.4" data-duration="4.8" data-track-index="1" data-width="1080" data-height="1920"></div>
        <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
             data-start="14.2" data-duration="5.8" data-track-index="1" data-width="1080" data-height="1920"></div>
      </div>

      <div id="subs" class="clip" data-start="0" data-duration="20" data-track-index="2">
        <div class="sub" id="sub-t1"><span class="oro">Hostelero:</span><span>¿sabes cuánto te</span><span class="oro">quedas</span><span>de cada</span><span class="dolor">20 €?</span></div>
        <div class="sub" id="sub-t2"><span>Por plataformas se te van</span><span class="dolor">~2.700 € al mes*</span><span>en comisiones</span></div>
        <div class="sub" id="sub-t3"><span>Con tu carta y pedidos directos,</span><span class="oro">el 100 %</span><span>se queda en</span><span class="oro">tu caja</span></div>
        <div class="sub" id="sub-t4"><span>Desde</span><span class="oro">1 €</span><span>el primer mes · Escríbenos</span><span class="oro">CARTA</span></div>
      </div>

      <hf-audio-group id="voz" data-label="Voz" data-volume="1"
        data-fx-chain='{"version":1,"nodes":[{"type":"highpass","id":"v1","label":"Remove Rumble","params":{"frequency":80,"q":0.707,"poles":"2"}},{"type":"peaking","id":"v2","label":"Reduce Mud","params":{"frequency":250,"gain":-3,"q":1.2}},{"type":"compressor","id":"v3","label":"Even Out Loudness","params":{"threshold":-20,"ratio":3,"attack":10,"release":180,"knee":2.83,"makeup":3,"mix":1}},{"type":"peaking","id":"v4","label":"Add Clarity","params":{"frequency":3000,"gain":2.5,"q":1}},{"type":"limiter","id":"v5","label":"Peak Ceiling","params":{"limit":-1,"attack":5,"release":50,"level_out":0}}]}'></hf-audio-group>
      <audio id="voz-t1" data-audio-group="voz" src="audio/voz-t1.mp3" data-start="0.15" data-duration="3.55" data-track-index="10" data-volume="1"></audio>
      <audio id="voz-t2" data-audio-group="voz" src="audio/voz-t2.mp3" data-start="3.85" data-duration="5.30" data-track-index="10" data-volume="1"></audio>
      <audio id="voz-t3" data-audio-group="voz" src="audio/voz-t3.mp3" data-start="9.4" data-duration="4.60" data-track-index="10" data-volume="1"></audio>
      <audio id="voz-t4" data-audio-group="voz" src="audio/voz-t4.mp3" data-start="14.3" data-duration="5.35" data-track-index="10" data-volume="1"></audio>

      <audio id="musica" data-audio-group="musica" src="audio/musica.mp3" data-start="0" data-duration="19.92" data-track-index="11" data-volume="0.45"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.35,"v":0.45},{"t":18.80,"v":0.45},{"t":19.88,"v":0}]}]}'></audio>

      <audio id="sfx-1" data-audio-group="sfx" src="assets/sfx/impresora.mp3" data-start="0.08" data-duration="1.45" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-2" data-audio-group="sfx" src="assets/sfx/golpe-sordo.mp3" data-start="1.56" data-duration="0.85" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-3" data-audio-group="sfx" src="assets/sfx/sello.mp3" data-start="1.72" data-duration="0.78" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-4" data-audio-group="sfx" src="assets/sfx/hojas.mp3" data-start="4.15" data-duration="1.3" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-5" data-audio-group="sfx" src="assets/sfx/riser.mp3" data-start="7.45" data-duration="1.8" data-track-index="12" data-volume="0.52"></audio>
      <audio id="sfx-6" data-audio-group="sfx" src="assets/sfx/cortina-luz.mp3" data-start="9.35" data-duration="1.2" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-7" data-audio-group="sfx" src="assets/sfx/notificacion.mp3" data-start="11.45" data-duration="0.55" data-track-index="12" data-volume="0.72"></audio>
      <audio id="sfx-8" data-audio-group="sfx" src="marca/sonido/pop.mp3" data-start="14.18" data-duration="0.4" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-9" data-audio-group="sfx" src="marca/sonido/cierre.mp3" data-start="18.4" data-duration="1" data-track-index="12" data-volume="0.75"></audio>
    </div>

    <script>
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261120);
      const caja = document.getElementById("particulas");
      const particulas = [];
      for (let i = 0; i < 24; i++) {
        const p = document.createElement("div");
        p.className = "particula";
        const tam = 3 + rnd() * 5;
        p.style.width = tam + "px"; p.style.height = tam + "px";
        p.style.left = Math.round(rnd() * 1080) + "px"; p.style.top = Math.round(rnd() * 1920) + "px";
        p.style.opacity = (0.22 + rnd() * 0.45).toFixed(2);
        caja.appendChild(p);
        particulas.push({ el: p, dy: -(140 + rnd() * 260), dx: (rnd() - 0.5) * 110 });
      }
      const D = 20;
      const tl = gsap.timeline({ paused: true });
      tl.to("#halo-vino", { x: 140, y: 100, scale: 1.12, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#halo-oro", { x: -120, y: -80, scale: 1.16, duration: D / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      particulas.forEach((p) => tl.to(p.el, { y: p.dy, x: p.dx, duration: D, ease: "none" }, 0));
      tl.fromTo("#camara", { scale: 1, rotation: -0.6 }, { scale: 1.038, rotation: 0.6, duration: D, ease: "sine.inOut" }, 0);

      function subtitulo(id, inicio, fin) {
        tl.set("#" + id, { opacity: 1 }, inicio);
        tl.fromTo("#" + id + " span", { y: 18, rotationX: -68, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.38, ease: "back.out(1.5)", stagger: 0.085 }, inicio);
        tl.to("#" + id, { opacity: 0, duration: 0.22, ease: "power2.in" }, fin - 0.22);
      }
      subtitulo("sub-t1", 0.15, 3.75);
      subtitulo("sub-t2", 3.85, 9.25);
      subtitulo("sub-t3", 9.4, 14.1);
      subtitulo("sub-t4", 14.3, 19.85);
      window.__timelines["lote1-r2-comision"] = tl;
    </script>
  </body>
</html>
