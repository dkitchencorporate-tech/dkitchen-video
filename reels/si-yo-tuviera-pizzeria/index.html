  v5: 'Esa pizza gratis me cuesta unos 3 € de ingredientes. Repartidos en 5 pedidos: 0,60 € por pedido.',
  v6: 'Pidiendo directo, me quedo 14,40 € en vez de 10,50 €. Casi 4 € más por pizza.',
  v7: 'Con 300 pedidos al mes… son más de 1.000 €.',
  v8: 'No necesitas bajar tus precios. Solo necesitas darle al cliente una razón para pedirte a ti.'
};
// Subtítulo palabra a palabra (las cifras van unidas a su símbolo y en dorado)
const cap = document.getElementById('cap'); const OSCURO = ['v3','v4'];
Object.entries(CAP).forEach(([id, txt]) => {
  const t = T[id]; if (!t) return;
  const pal = txt.replace(/ (€|%)/g, ' $1').split(' ');
  const pesos = pal.map(p => Math.max(2, p.replace(/[^\p{L}\p{N}]/gu, '').length));
  const total = pesos.reduce((a, b) => a + b, 0); let acc = 0;
  pal.forEach((p, i) => {
    const s = document.createElement('span'); s.className = 'w' + (/\d/.test(p) ? ' n' : ''); s.textContent = p; cap.appendChild(s);
    const ini = t.s + t.d * (acc / total); acc += pesos[i]; const fin = t.s + t.d * (acc / total);
    const col = OSCURO.includes(id) ? (/\d/.test(p) ? '#6E0C2B' : '#0A080C') : (/\d/.test(p) ? '#D9B25C' : '#F7F5F2');
    tl.set(s, { opacity: 1, color: col, textShadow: OSCURO.includes(id) ? 'none' : '0 6px 30px rgba(0,0,0,.75)' }, ini);
    tl.fromTo(s, { scale: 1.18 }, { scale: 1, duration: .14, ease: 'power2.out' }, ini);
    tl.set(s, { opacity: 0 }, i === pal.length - 1 ? Math.min(fin + .25, t.s + t.d + .25) : fin);
  });
});
const entra = (sel, t) => tl.set(sel, { opacity: 1 }, t);
const sale = (sel, t) => tl.set(sel, { opacity: 0 }, t);
const S = (id) => T[id].s;
// E1 · 0 → v2
entra('#e1', 0); tl.fromTo('#f1', { scale: 1.02 }, { scale: 1.14, duration: S('v2'), ease: 'none' }, 0);
tl.fromTo('#flash', { opacity: 0 }, { opacity: .9, duration: .08, yoyo: true, repeat: 1, ease: 'none' }, 1.7);
tl.set('#f1', { filter: 'grayscale(1) contrast(1.08) brightness(.82)' }, 1.78);
sale('#e1', S('v2') - .1);
// E2 · v2: 15 € → −30 % → 10,50 €
entra('#e2', S('v2') - .1); tl.fromTo('#c2', { scale: .6, rotation: -25 }, { scale: 1, rotation: 0, duration: .6, ease: 'back.out(1.6)' }, S('v2') - .1);
tl.to('#c2', { rotation: 20, duration: 5.5, ease: 'none' }, S('v2') + .5);
tl.fromTo('#n15', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .3 }, S('v2') + .5);
tl.set('#n15', { opacity: 0 }, S('v2') + T.v2.d * .5); tl.fromTo('#n30', { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: .2 }, S('v2') + T.v2.d * .5);
tl.set('#n30', { opacity: 0 }, S('v2') + T.v2.d * .8); tl.fromTo('#n1050', { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: .2 }, S('v2') + T.v2.d * .8);
sale('#e2', S('v3') - .1);
// E3 · v3: la dinámica y la fila de 6
entra('#e3', S('v3') - .1); tl.from('#t3a', { y: 60, opacity: 0, duration: .3 }, S('v3')); tl.from('#t3b', { y: 80, opacity: 0, duration: .4 }, S('v3') + .5);
document.querySelectorAll('#fila .punto').forEach((p, i) => tl.fromTo(p, { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: .22, ease: 'back.out(2)' }, S('v3') + T.v3.d * .45 + i * .26));
tl.fromTo('#gratis', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .25 }, S('v3') + T.v3.d * .45 + 6 * .26);
tl.to('#sexta', { scale: 1.12, duration: .3, yoyo: true, repeat: 3, ease: 'sine.inOut' }, S('v3') + T.v3.d * .45 + 6 * .26);
sale('#e3', S('v4') - .1);
// E4 · v4: el giro
entra('#e4', S('v4') - .1); tl.fromTo('#e4 .titular', { y: 40 }, { y: 0, duration: 1.6, ease: 'power2.out' }, S('v4') - .1);
sale('#e4', S('v5') - .1);
// E5 · v5: 3 € ÷ 5 = 0,60 €
entra('#e5', S('v5') - .1); tl.fromTo('#f5', { scale: 1.14 }, { scale: 1.0, duration: S('v6') - S('v5') + .1, ease: 'none' }, S('v5') - .1);
tl.fromTo('#n3', { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: .25 }, S('v5') + T.v5.d * .3);
tl.fromTo('#ndiv', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .25 }, S('v5') + T.v5.d * .55);
tl.set('#n3', { opacity: 0 }, S('v5') + T.v5.d * .78); tl.fromTo('#n060', { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: .25 }, S('v5') + T.v5.d * .78);
sale('#e5', S('v6') - .1);
// E6 · v6: barras plataforma / directo
entra('#e6', S('v6') - .1);
tl.fromTo('#b1', { width: 120 }, { width: 10.5 / 14.4 * 760, duration: .7, ease: 'power3.out' }, S('v6') - .1); tl.to('#v1050', { opacity: 1, duration: .2 }, S('v6') + .6);
tl.to('#b2', { width: 760, duration: .8, ease: 'power3.out' }, S('v6') + T.v6.d * .3); tl.to('#v1440', { opacity: 1, duration: .2 }, S('v6') + T.v6.d * .3 + .4);
tl.to('#v1440', { scale: 1.08, transformOrigin: '0 50%', duration: .3, yoyo: true, repeat: 1 }, S('v6') + T.v6.d * .7);
sale('#e6', S('v7') - .1);
// E7 · v7: contador mensual
entra('#e7', S('v7') - .1); tl.fromTo('#f7', { scale: 1.02 }, { scale: 1.14, duration: S('v8') - S('v7') + .1, ease: 'none' }, S('v7') - .1);
const k = { v: 0 }; tl.to(k, { v: 1170, duration: T.v7.d * .7, ease: 'power2.out', onUpdate: () => { document.getElementById('cont').textContent = '+' + Math.round(k.v).toLocaleString('es-ES').replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' €'; } }, S('v7') + .3);
tl.fromTo('#almes', { opacity: 0 }, { opacity: 1, duration: .3 }, S('v7') + T.v7.d * .5);
sale('#e7', S('v8') - .1);
// E8 · v8: moraleja, blanco y negro → color
entra('#e8', S('v8') - .1); tl.fromTo(['#f8','#f8c'], { scale: 1.12 }, { scale: 1.0, duration: 40.5 - S('v8') + .1, ease: 'none' }, S('v8') - .1);
tl.to('#f8c', { opacity: 1, duration: .5 }, S('v8') + T.v8.d * .4);
tl.to('#velo8', { opacity: 1, duration: .5 }, S('v8') + T.v8.d * .4);
tl.fromTo('#mor', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .5 }, S('v8') + T.v8.d * .45);

['#e2','#e3','#e4','#e6'].forEach((s, i) => { const ini = [S('v2'), S('v3'), S('v4'), S('v6')][i] - .1; const fin = [S('v3'), S('v4'), S('v5'), S('v7')][i]; tl.fromTo(s, { scale: 1, y: 0 }, { scale: 1.05, y: -18, duration: fin - ini, ease: 'none' }, ini); });
tl.to('#fila', { x: -10, duration: 3, ease: 'none' }, S('v3') + 1);
window.__timelines['si-yo-tuviera-pizzeria'] = tl;
</script></body></html>
