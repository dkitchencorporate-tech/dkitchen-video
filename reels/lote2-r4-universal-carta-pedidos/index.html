    <script>
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261120);
      const caja = document.getElementById("particulas");
      const particulas = [];
      for (let i = 0; i < 24; i++) {
        const p = document.createElement("div");
        p.className = "particula";
        const tam = 3 + rnd() * 5;
        p.style.width = tam + "px"; p.style.height = tam + "px";
        p.style.left = Math.round(rnd() * 1080) + "px"; p.style.top = Math.round(rnd() * 1920) + "px";
        p.style.opacity = (0.22 + rnd() * 0.45).toFixed(2);
        caja.appendChild(p);
        particulas.push({ el: p, dy: -(140 + rnd() * 260), dx: (rnd() - 0.5) * 110 });
      }
      const D = 18;
      const tl = gsap.timeline({ paused: true });
      tl.to("#halo-vino", { x: 140, y: 100, scale: 1.12, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#halo-oro", { x: -120, y: -80, scale: 1.16, duration: D / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      particulas.forEach((p) => tl.to(p.el, { y: p.dy, x: p.dx, duration: D, ease: "none" }, 0));
      tl.fromTo("#camara", { scale: 1, rotation: -0.6 }, { scale: 1.038, rotation: 0.6, duration: D, ease: "sine.inOut" }, 0);

      function subtitulo(id, inicio, fin) {
        tl.set("#" + id, { opacity: 1 }, inicio);
        tl.fromTo("#" + id + " span", { y: 18, rotationX: -68, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.38, ease: "back.out(1.5)", stagger: 0.085 }, inicio);
        tl.to("#" + id, { opacity: 0, duration: 0.22, ease: "power2.in" }, fin - 0.22);
      }
      subtitulo("sub-t1", 0.15, 3.75);
      subtitulo("sub-t2", 3.85, 8.95);
      subtitulo("sub-t3", 9.05, 13.8);
      subtitulo("sub-t4", 13.95, 17.85);
      window.__timelines["lote2-r4-universal-carta-pedidos"] = tl;
