<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena · Escanea</title></head>
  <body>
    <template id="escanea">
      <style>
        #root { position: absolute; inset: 0; }
        #esc-pal { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 250px; display: flex; justify-content: center; perspective: 1200px; }
        #esc-pal span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 172px; line-height: 0.9; letter-spacing: -6px; color: #F7F5F2; text-shadow: 0 20px 60px rgba(5,4,6,0.7); }
        #esc-pal span.oro { color: #F0C96F; }
        #esc-esc { position: absolute; left: 290px; top: 380px; width: 500px; height: 1082px; perspective: 1400px; }
        #esc-movil { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 0; border-radius: 72px; background: linear-gradient(145deg, #2a2428, #0d0b0e 40%, #1c181b); padding: 14px; box-shadow: 0 60px 120px -20px rgba(0,0,0,0.9), 0 0 0 2px rgba(217,178,92,0.35), inset 0 0 0 2px rgba(255,255,255,0.06); }
        #esc-pantalla { position: relative; width: 472px; height: 1054px; border-radius: 58px; overflow: hidden; background: #0B0A09; }
        #esc-isla { position: absolute; left: 176px; top: 18px; width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 9; }
        #esc-camara { position: absolute; inset: -60px; background-image: url('assets/capturas/inicio.jpg'); background-size: cover; background-position: center; filter: blur(22px) brightness(0.45) saturate(1.2); }
        #esc-tarjeta { position: absolute; left: 86px; top: 330px; width: 300px; height: 300px; border-radius: 28px; background-color: #fff; background-image: url('assets/qr-tarjeta.png'); background-size: 1542px auto; background-position: -97px -210px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .esc-esq { position: absolute; width: 70px; height: 70px; border-color: #F0C96F; border-style: solid; border-width: 0; filter: drop-shadow(0 0 10px rgba(240,201,111,0.8)); }
        #esc-e1 { left: 46px; top: 290px; border-top-width: 8px; border-left-width: 8px; border-top-left-radius: 22px; }
        #esc-e2 { left: 356px; top: 290px; border-top-width: 8px; border-right-width: 8px; border-top-right-radius: 22px; }
        #esc-e3 { left: 46px; top: 600px; border-bottom-width: 8px; border-left-width: 8px; border-bottom-left-radius: 22px; }
        #esc-e4 { left: 356px; top: 600px; border-bottom-width: 8px; border-right-width: 8px; border-bottom-right-radius: 22px; }
        #esc-laser { position: absolute; left: 70px; top: 320px; width: 332px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(240,201,111,0), #F0C96F, rgba(240,201,111,0)); box-shadow: 0 0 24px 6px rgba(240,201,111,0.55); }
        #esc-aviso { position: absolute; left: 60px; right: 60px; top: 720px; padding: 22px 26px; border-radius: 26px; background: rgba(247,245,242,0.14); border: 1px solid rgba(247,245,242,0.25); backdrop-filter: blur(14px); font-family: var(--font-body); font-weight: 600; font-size: 30px; color: #F7F5F2; text-align: center; }
        #esc-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
        #esc-carta { position: absolute; inset: 0; background-image: url('assets/capturas/inicio.jpg'); background-size: 472px auto; background-position: top center; opacity: 0; }
        #esc-onda { position: absolute; left: 196px; top: 440px; width: 80px; height: 80px; border-radius: 50%; border: 5px solid #F0C96F; opacity: 0; }
      </style>

      <div id="root" data-composition-id="escanea" data-width="1080" data-height="1920">
        <div id="esc-pal" data-layout-allow-occlusion><span>Esca</span><span class="oro">nea</span></div>
        <div id="esc-esc">
          <div id="esc-movil">
            <div id="esc-pantalla">
              <div id="esc-camara"></div>
              <div id="esc-tarjeta"></div>
              <div class="esc-esq" id="esc-e1"></div><div class="esc-esq" id="esc-e2"></div>
              <div class="esc-esq" id="esc-e3"></div><div class="esc-esq" id="esc-e4"></div>
              <div id="esc-laser"></div>
              <div id="esc-aviso">Mesa 4 · Abrir la carta</div>
              <div id="esc-onda"></div>
              <div id="esc-flash"></div>
              <div id="esc-carta"></div>
              <div id="esc-isla"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Fotograma 0 ya con el móvil y el QR (miniatura): entra girando desde una perspectiva marcada
        tl.fromTo("#esc-movil", { rotationY: -24, rotationX: 10, scale: 0.84, y: 40 }, { rotationY: -8, rotationX: 4, scale: 0.88, y: 0, duration: 2.6, ease: "power2.out" }, 0);
        tl.fromTo("#esc-pal span", { y: 40, rotationX: -70, opacity: 0.35 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)", stagger: 0.12 }, 0);
        tl.fromTo("#esc-camara", { scale: 1.15, x: 20 }, { scale: 1.0, x: -20, duration: 2.0, ease: "sine.inOut" }, 0);
        tl.fromTo("#esc-tarjeta", { rotation: -7, scale: 0.92 }, { rotation: -2, scale: 1, duration: 1.5, ease: "power2.out" }, 0);
        // Láser de lectura (dos pasadas) y esquinas que se cierran sobre el código
        tl.fromTo("#esc-laser", { y: 0, opacity: 1 }, { y: 290, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1);
        tl.to("#esc-laser", { opacity: 0, duration: 0.15 }, 1.3);
        tl.fromTo("#esc-e1", { x: -26, y: -26 }, { x: 14, y: 14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#esc-e2", { x: 26, y: -26 }, { x: -14, y: 14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#esc-e3", { x: -26, y: 26 }, { x: 14, y: -14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#esc-e4", { x: 26, y: 26 }, { x: -14, y: -14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#esc-aviso", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.45);
        // Toque en el aviso: onda táctil
        tl.fromTo("#esc-onda", { y: 290, scale: 0.3, opacity: 1 }, { y: 290, scale: 2.4, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.85);
        // Destello y se abre la carta real
        tl.fromTo("#esc-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "none" }, 2.05);
        tl.to("#esc-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 2.13);
        tl.fromTo("#esc-carta", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 2.1);
        // Salida motivada hacia la escena siguiente (el móvil sigue: match cut)
        tl.to("#esc-pal", { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.7);
        window.__timelines["escanea"] = tl;
      </script>
    </template>
  </body>
</html>
