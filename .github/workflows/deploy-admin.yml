name: Deploy Admin to Vercel
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar artefactos de vídeo para previsualización privada del admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p admin/public/media/v1-la-carta-en-llamas admin/public/media/reel-01 admin/public/media/reel-02 admin/public/media/reel-piloto admin/public/media/reel-cinematic-pro
          # Descargar nueva pieza 01 de autor v1-la-carta-en-llamas 35s (Run 37566028892)
          gh run download 37566028892 -n entrega-37566028892 -D admin/public/media/v1-la-carta-en-llamas || echo "Artefacto v1-la-carta-en-llamas no disponible"
          # Descargar reel-01 rediseñado (Run 37562286863)
          gh run download 37562286863 -n entrega-37562286863 -D admin/public/media/reel-01 || echo "Artefacto reel-01 no disponible"
          # Descargar reel-02 rediseñado (Run 37562296886)
          gh run download 37562296886 -n entrega-37562296886 -D admin/public/media/reel-02 || echo "Artefacto reel-02 no disponible"
          # Descargar reel-piloto rediseñado (Run 37562275330)
          gh run download 37562275330 -n entrega-37562275330 -D admin/public/media/reel-piloto || echo "Artefacto reel-piloto no disponible"
          # Descargar reel-cinematic-pro (Run 37358694229)
          gh run download 37358694229 -n entrega-37358694229 -D admin/public/media/reel-cinematic-pro || echo "Artefacto reel-cinematic-pro no disponible"
          ls -la admin/public/media/* || true

      - name: Instalar Vercel CLI y Dependencias
        working-directory: admin
        run: |
          npm install -g vercel@latest
          npm install

      - name: Build y Deploy a Vercel
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "[ERROR FATAL] VERCEL_TOKEN no está configurado en GitHub Secrets."
            exit 1
          fi
          # Asegurar que las variables de entorno de seguridad existan en Vercel Production
          printf "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP" | vercel env add STUDIO_TOTP_SECRET production --token=$VERCEL_TOKEN --force || true
          printf "4f89d3a77b819fbc2e0d31405e3f228491bb4c03de10c3672909" | vercel env add STUDIO_SESSION_SECRET production --token=$VERCEL_TOKEN --force || true
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
