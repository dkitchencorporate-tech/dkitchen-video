<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena · Tu Carta y App</title></head>
  <body>
    <template id="app">
      <style>
        #root { position: absolute; inset: 0; }
        #app-pal { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 260px; display: flex; justify-content: center; align-items: baseline; gap: 18px; }
        #app-pal span { font-family: var(--font-display); font-weight: 800; font-size: 132px; line-height: 0.9; color: #F0C96F; text-shadow: 0 20px 60px rgba(5,4,6,0.85); }
        #app-pal em { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 92px; color: #F7F5F2; }
        #app-esc { position: absolute; left: 260px; top: 400px; width: 480px; height: 1020px; perspective: 1400px; }
        #app-movil { position: absolute; inset: 0; transform-style: preserve-3d; border-radius: 68px; background: linear-gradient(145deg, #2a2428, #0d0b0e 40%, #1c181b); padding: 14px; box-shadow: 0 60px 120px -20px rgba(0,0,0,0.9), 0 0 0 2px rgba(217,178,92,0.4); }
        #app-pantalla { position: relative; width: 452px; height: 992px; border-radius: 56px; overflow: hidden; background: #0B0A09; }
        #app-img { position: absolute; left: 0; top: 0; width: 452px; }
        #app-notif { position: absolute; left: 85px; right: 165px; top: 760px; border-radius: 26px; background: rgba(11,26,20,0.94); border: 2px solid #10B981; padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 24px 60px rgba(0,0,0,0.7); opacity: 0; }
        #app-notif b { font-family: var(--font-display); font-size: 32px; color: #F7F5F2; }
        #app-notif span { font-family: var(--font-display); font-weight: 800; font-size: 34px; color: #10B981; }
        #app-chips { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 920px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; opacity: 0; }
        .app-chip { padding: 14px 26px; border-radius: 999px; background: rgba(110,12,43,0.92); border: 1.5px solid #D9B25C; font-family: var(--font-body); font-weight: 700; font-size: 29px; color: #F7F5F2; }
      </style>
      <div id="root" data-composition-id="app" data-width="1080" data-height="1920">
        <div id="app-pal" data-layout-allow-occlusion><span>0 %</span><em>comisiones</em></div>
        <div id="app-esc">
          <div id="app-movil" data-layout-allow-occlusion>
            <div id="app-pantalla" data-layout-allow-overflow>
              <img id="app-img" data-layout-allow-overflow src="assets/capturas/carta.jpg" alt="" />
            </div>
          </div>
        </div>
        <div id="app-notif" data-layout-allow-occlusion><b>Nuevo pedido directo</b><span>100 % para ti</span></div>
        <div id="app-chips" data-layout-allow-occlusion>
          <span class="app-chip">Tu carta</span>
          <span class="app-chip">Tu panel</span>
          <span class="app-chip">Margen íntegro</span>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#app-pal span, #app-pal em", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)", stagger: 0.12 }, 0.05);
        tl.fromTo("#app-movil", { rotationY: -18, rotationX: 8, scale: 0.86 }, { rotationY: 8, rotationX: 2, scale: 0.92, duration: 6.1, ease: "sine.inOut" }, 0);
        tl.fromTo("#app-img", { y: 0 }, { y: -1800, duration: 3.4, ease: "power2.inOut" }, 0.3);
        tl.fromTo("#app-notif", { y: 40, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 2.6);
        tl.fromTo("#app-chips", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 4.2);
        tl.to("#app-pal, #app-notif, #app-chips", { y: -24, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.85);
        window.__timelines["app"] = tl;
      </script>
    </template>
  </body>
</html>
