<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><title>Hook Papel</title></head><body>
<template id="hook_papel">
  <style>
    #root { position: absolute; inset: 0; }
    #hp-bg { position: absolute; inset: -60px; background-image: url('assets/media/bg-carta-vieja.jpg'); background-size: cover; background-position: center; filter: brightness(0.42) contrast(1.06); }
    #hp-veil { position: absolute; inset: 0; background: radial-gradient(circle at 50% 44%, rgba(16,12,10,0.3) 0%, rgba(5,4,6,0.92) 86%); }
    #hp-pill { position: absolute; left: 95px; right: 175px; top: 268px; text-align: center; }
    #hp-pill span { display: inline-block; padding: 12px 26px; border-radius: 999px; background: rgba(110,12,43,0.94); border: 2px solid #D9B25C; font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: 1px; color: #F0C96F; box-shadow: 0 12px 30px rgba(0,0,0,0.65); }
    #hp-tit { position: absolute; left: 95px; right: 175px; top: 344px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 68px; line-height: 1.02; color: #F7F5F2; }
    #hp-tit em { font-family: 'Cormorant Garamond', serif; font-style: italic; color: #FF5A82; font-size: 80px; }
    #hp-sheet { position: absolute; left: 105px; right: 185px; top: 505px; border-radius: 22px; background: #EFE8DC; color: #241C16; padding: 34px 36px; box-shadow: 0 46px 90px rgba(0,0,0,0.88); border-left: 12px solid #8E153A; }
    .hp-line { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 2px solid rgba(36,28,22,0.16); font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 38px; }
    .hp-price-wrap { position: relative; display: flex; align-items: center; gap: 18px; font-family: var(--font-display); font-size: 36px; }
    .hp-strike { position: relative; color: #6B625A; }
    .hp-slash { position: absolute; left: -6px; top: 50%; width: 112%; height: 6px; background: #D91E48; transform: rotate(-10deg); transform-origin: left center; }
    #hp-newp { color: #B01238; font-weight: 800; opacity: 0; }
    #hp-agotado { padding: 8px 20px; border: 4px solid #B01238; border-radius: 10px; color: #B01238; font-family: var(--font-display); font-weight: 800; font-size: 30px; opacity: 0; }
    #hp-chips { position: absolute; left: 95px; right: 175px; top: 945px; display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
    .hp-chip { padding: 12px 24px; border-radius: 999px; background: rgba(18,12,16,0.92); border: 2px solid #FF5A82; font-family: var(--font-body); font-weight: 700; font-size: 28px; color: #FF94AF; }
  </style>
  <div id="root" data-composition-id="hook_papel" data-width="1080" data-height="1920">
    <div id="hp-bg" data-layout-allow-overflow></div>
    <div id="hp-veil"></div>
    <div id="hp-pill" data-layout-allow-occlusion><span>DUEÑO DE BAR O RESTAURANTE</span></div>
    <div id="hp-tit" data-layout-allow-occlusion>¿Sigues <em>tachando</em> precios?</div>
    <div id="hp-sheet" data-layout-allow-occlusion>
      <div class="hp-line"><span>Tortilla de trufa</span><div class="hp-price-wrap"><span class="hp-strike">11,50 €<i class="hp-slash" id="hp-sl1"></i></span><b id="hp-newp">12,50 €</b></div></div>
      <div class="hp-line"><span>Pipirrana de bacalao</span><span id="hp-agotado">AGOTADO</span></div>
      <div class="hp-line" style="border-bottom:none"><span>Mariscada del día</span><span>26,00 €</span></div>
    </div>
    <div id="hp-chips" data-layout-allow-occlusion>
      <span class="hp-chip">Papel tachado</span>
      <span class="hp-chip">Imprenta cara</span>
      <span class="hp-chip">Sin fotos</span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#hp-bg", { scale: 1.0, y: 0 }, { scale: 1.09, y: -16, duration: 3.8, ease: "sine.inOut" }, 0);
    tl.fromTo("#hp-pill", { y: -8, opacity: 0.95 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
    tl.fromTo("#hp-tit", { y: 12, opacity: 0.95 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo("#hp-sheet", { y: 26, rotation: -1.5, opacity: 0.92 }, { y: 0, rotation: -0.5, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
    tl.fromTo("#hp-sl1", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 0.75);
    tl.fromTo("#hp-newp", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2)" }, 1.05);
    tl.fromTo("#hp-agotado", { scale: 1.7, opacity: 0, rotation: 6 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.35, ease: "back.out(2.2)" }, 1.45);
    tl.fromTo(".hp-chip", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.5)", stagger: 0.12 }, 1.85);
    tl.to("#hp-pill, #hp-tit, #hp-sheet, #hp-chips", { y: -24, opacity: 0, duration: 0.28, ease: "power2.in" }, 3.48);
    window.__timelines["hook_papel"] = tl;
  </script>
</template></body></html>
