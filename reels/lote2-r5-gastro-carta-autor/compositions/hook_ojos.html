<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><title>Hook Ojos</title></head><body>
<template id="hook_ojos">
  <style>

    <div id="ho-bg" data-layout-allow-overflow></div>
    <div id="ho-veil"></div>
    <div id="ho-pill" data-layout-allow-occlusion><span>SI TIENES UN RESTAURANTE</span></div>

  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#ho-bg", { scale: 1.0, y: 12 }, { scale: 1.10, y: -18, duration: 3.8, ease: "sine.inOut" }, 0);
    tl.fromTo("#ho-pill", { y: -8, opacity: 0.95 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
    tl.fromTo("#ho-tit", { y: 14, opacity: 0.95 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
    tl.fromTo("#ho-ban", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, 1.1);
    tl.to("#ho-pill, #ho-tit, #ho-ban", { y: -24, opacity: 0, duration: 0.28, ease: "power2.in" }, 3.48);
    window.__timelines["hook_ojos"] = tl;
  </script>
</template></body></html>
