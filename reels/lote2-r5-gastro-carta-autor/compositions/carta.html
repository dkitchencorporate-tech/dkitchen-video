<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena · Carta</title></head>
  <body>
    <template id="carta">
      <style>
        #root { position: absolute; inset: 0; }
        #car-pal { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 250px; display: flex; justify-content: center; align-items: baseline; gap: 18px; perspective: 1200px; }
        #car-pal span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 152px; line-height: 0.9; letter-spacing: -6px; color: #F7F5F2; text-shadow: 0 20px 60px rgba(5,4,6,0.75); }
        #car-pal em { display: inline-block; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 90px; color: #F0C96F; }
        #car-esc { position: absolute; left: 290px; top: 380px; width: 500px; height: 1082px; perspective: 1400px; }
        #car-movil { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 0; border-radius: 72px; background: linear-gradient(145deg, #2a2428, #0d0b0e 40%, #1c181b); padding: 14px; box-shadow: 0 60px 120px -20px rgba(0,0,0,0.9), 0 0 0 2px rgba(217,178,92,0.35), inset 0 0 0 2px rgba(255,255,255,0.06); }
        #car-pantalla { position: relative; width: 472px; height: 1054px; border-radius: 58px; overflow: hidden; background: #0B0A09; }
        #car-isla { position: absolute; left: 176px; top: 18px; width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 9; }
        #car-img { position: absolute; left: 0; top: 0; width: 472px; }
        #car-brillo { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0) 65%); }
        #car-onda { position: absolute; left: 196px; top: 580px; width: 80px; height: 80px; border-radius: 50%; border: 5px solid #F0C96F; background: rgba(240,201,111,0.25); opacity: 0; }
        #car-chip { position: absolute; left: 420px; top: 940px; padding: 18px 28px; border-radius: 26px; background: rgba(14,11,15,0.88); border: 1.5px solid rgba(217,178,92,0.65); font-family: var(--font-body); font-weight: 700; font-size: 30px; color: #F7F5F2; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        #car-chip b { color: #F0C96F; }
      </style>

      <div id="root" data-composition-id="carta" data-width="1080" data-height="1920">
        <div id="car-pal" data-layout-allow-occlusion><span>Diseño</span><em>editorial</em></div>
        <div id="car-esc">
          <div id="car-movil">
            <div id="car-pantalla">
              <img id="car-img" src="assets/capturas/carta.jpg" alt="" />
              <div id="car-brillo"></div>
              <div id="car-onda"></div>
              <div id="car-isla"></div>
            </div>
          </div>
        </div>
        <div id="car-chip">Emblema <b>·</b> platos <b>·</b> alérgenos</div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#car-movil", { rotationY: -8, rotationX: 4, scale: 0.88 }, { rotationY: 6, rotationX: 2, scale: 0.94, duration: 3.8, ease: "sine.inOut" }, 0);
        tl.fromTo("#car-pal span, #car-pal em", { y: 40, rotationX: -75, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.5, ease: "back.out(1.5)", stagger: 0.14 }, 0.05);
        tl.fromTo("#car-img", { y: 0 }, { y: -1150, duration: 1.2, ease: "power2.inOut" }, 0.15);
        tl.to("#car-img", { y: -2300, duration: 1.3, ease: "power3.out" }, 1.35);
        tl.fromTo("#car-brillo", { x: -520 }, { x: 520, duration: 1.1, ease: "power1.inOut" }, 0.4);
        tl.fromTo("#car-chip", { x: 60, opacity: 0, rotationY: -30 }, { x: 0, opacity: 1, rotationY: 0, duration: 0.5, ease: "back.out(1.6)" }, 2.2);
        tl.fromTo("#car-onda", { scale: 0.3, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.55, ease: "power2.out" }, 2.9);
        tl.to("#car-pal, #car-chip", { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);
        window.__timelines["carta"] = tl;
      </script>
    </template>
  </body>
</html>
