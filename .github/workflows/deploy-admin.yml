name: Deploy Admin to Vercel
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID del render para descargar el artefacto nuevo (opcional; si se omite, toma el último de cada pieza)'
        required: false
      carpeta:
        description: 'Carpeta de la pieza'
        required: false
        default: 'reels/pieza-01'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar artefactos de vídeo para previsualización privada del admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p admin/public/media/pieza-01
          mkdir -p admin/public/media/pieza-02

          # Función auxiliar para descargar el último artefacto 'entrega-*'
          descargar_ultimo_artefacto() {
            local pieza_dir="$1"
            echo "[Admin] Buscando último artefacto para $pieza_dir..."
            
            # Buscar el último run exitoso de 'Renderizar reel'
            local run_ids=$(gh run list --workflow="Renderizar reel" --status="success" --limit 10 --json databaseId -q '.[].databaseId')
            local encontrado=false

            for rid in $run_ids; do
              local art_name=$(gh run view "$rid" --json artifacts -q '.artifacts[] | select(.name | startswith("entrega-")) | .name' | head -n 1)
              if [ -n "$art_name" ]; then
                echo "[Admin] Descargando $art_name (Run $rid) en admin/public/media/$pieza_dir..."
                rm -rf "admin/public/media/$pieza_dir/*"
                if gh run download "$rid" -n "$art_name" -D "admin/public/media/$pieza_dir"; then
                  encontrado=true
                  break
                fi
              fi
            done

            if [ "$encontrado" = false ]; then
              echo "[AVISO] No se pudo obtener automáticamente el último artefacto dinámico para $pieza_dir"
            fi
          }

          # 1. Si se pasa run_id explícito, descargarlo prioritariamente en la carpeta seleccionada:
          if [ -n "${{ inputs.run_id }}" ]; then
            TARGET_SLUG=$(basename "${{ inputs.carpeta }}")
            echo "[Admin] Descargando artefacto de render específico: ${{ inputs.run_id }} en $TARGET_SLUG..."
            mkdir -p "admin/public/media/$TARGET_SLUG"
            rm -rf "admin/public/media/$TARGET_SLUG/*"
            gh run download "${{ inputs.run_id }}" -n "entrega-${{ inputs.run_id }}" -D "admin/public/media/$TARGET_SLUG" || echo "[AVISO] No se pudo descargar entrega-${{ inputs.run_id }}"
          else
            # 2. Descarga dinámica de los últimos artefactos sin run ID hardcodeados a mano
            descargar_ultimo_artefacto "pieza-01"
            descargar_ultimo_artefacto "pieza-02"
          fi

          ls -la admin/public/media/* || true

      - name: Instalar Vercel CLI y Dependencias
        working-directory: admin
        run: |
          npm install -g vercel@latest
          npm install

      - name: Build y Deploy a Vercel
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "[ERROR FATAL] VERCEL_TOKEN no está configurado en GitHub Secrets."
            exit 1
          fi
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
