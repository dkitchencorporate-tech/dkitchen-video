<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DKitchen · El ticket · 0 % comisiones</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="marca/tokens.css" />
    <link rel="stylesheet" href="marca/fuentes.css" />
    <style>
      @font-face { font-family: 'Bricolage Grotesque'; src: url('marca/fuentes/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('marca/fuentes/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('marca/fuentes/cormorant-garamond-latin.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: block; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('marca/fuentes/cormorant-garamond-italic-latin.woff2') format('woff2'); font-weight: 300 700; font-style: italic; font-display: block; }
      body { margin: 0; background: #050406; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050406; font-family: var(--font-body); color: var(--papel); }
      #fondo { position: absolute; inset: 0; }
      .halo { position: absolute; border-radius: 50%; filter: blur(64px); }
      #halo-vino { width: 1450px; height: 1450px; left: -420px; top: -280px; background: radial-gradient(circle, rgba(110,12,43,0.90) 0%, rgba(22,14,24,0) 70%); }
      #halo-oro { width: 1150px; height: 1150px; left: 220px; top: 1020px; background: radial-gradient(circle, rgba(217,178,92,0.42) 0%, rgba(14,12,18,0) 70%); }
      #rejilla { position: absolute; inset: 0; opacity: 0.14; background-image: radial-gradient(rgba(247,245,242,0.55) 1.5px, transparent 1.5px); background-size: 36px 36px; }
      .particula { position: absolute; border-radius: 50%; background: #F0C96F; box-shadow: 0 0 12px rgba(240,201,111,0.8); }
      #camara { position: absolute; inset: 0; transform-origin: 50% 45%; }
      #subs { position: absolute; left: calc(var(--safe-left) + 20px); right: calc(var(--safe-right) + 20px); bottom: calc(var(--safe-bottom) + 30px); height: 240px; }
      .sub { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; gap: 0 16px; opacity: 0; }
      .sub span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 50px; line-height: 1.12; color: #FFFFFF; text-shadow: 0 4px 18px rgba(5,4,6,0.95), 0 0 2px rgba(5,4,6,1); }
      .sub span.oro { color: #F0C96F; }
      .sub span.dolor { color: #FF5A82; }
    </style>
  </head>
  <body>
    <div id="raiz" data-composition-id="lote1-r2-comision" data-start="0" data-width="1080" data-height="1920" data-duration="20">
      <div id="fondo" class="clip" data-start="0" data-duration="20" data-track-index="0" data-layout-allow-overflow>
        <div id="halo-vino" class="halo"></div>
        <div id="halo-oro" class="halo"></div>
        <div id="rejilla"></div>
        <div id="particulas"></div>
      </div>

      <div id="camara">
        <div id="ticket" data-composition-id="ticket" data-composition-src="compositions/ticket.html"
             data-start="0" data-duration="3.2" data-track-index="1" data-width="1080" data-height="1920"></div>
        <div id="calculadora" data-composition-id="calculadora" data-composition-src="compositions/calculadora.html"
             data-start="3.2" data-duration="6.2" data-track-index="1" data-width="1080" data-height="1920"></div>
        <div id="app" data-composition-id="app" data-composition-src="compositions/app.html"
             data-start="9.4" data-duration="6.2" data-track-index="1" data-width="1080" data-height="1920"></div>
        <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
             data-start="15.6" data-duration="4.4" data-track-index="1" data-width="1080" data-height="1920"></div>
      </div>

      <div id="subs" class="clip" data-start="0" data-duration="20" data-track-index="2">
        <div class="sub" id="sub-t1"><span>¿Cuánto te</span><span class="oro">quedas</span><span>de cada</span><span class="dolor">20 €?</span></div>
        <div class="sub" id="sub-t2"><span>Con</span><span>plataformas</span><span>se van</span><span class="dolor">2.700 € al mes*</span></div>
        <div class="sub" id="sub-t3"><span>Con tu</span><span class="oro">propia carta y app</span><span>se queda en tu</span><span class="oro">local</span></div>
        <div class="sub" id="sub-t4"><span>Escríbenos</span><span class="oro">CARTA</span><span>y mira cuánto</span><span class="oro">ahorras</span></div>
      </div>

      <hf-audio-group id="voz" data-label="Voz" data-volume="1"
        data-fx-chain='{"version":1,"nodes":[{"type":"highpass","id":"v1","label":"Remove Rumble","params":{"frequency":80,"q":0.707,"poles":"2"}},{"type":"peaking","id":"v2","label":"Reduce Mud","params":{"frequency":250,"gain":-3,"q":1.2}},{"type":"compressor","id":"v3","label":"Even Out Loudness","params":{"threshold":-20,"ratio":3,"attack":10,"release":180,"knee":2.83,"makeup":3,"mix":1}},{"type":"peaking","id":"v4","label":"Add Clarity","params":{"frequency":3000,"gain":2.5,"q":1}},{"type":"limiter","id":"v5","label":"Peak Ceiling","params":{"limit":-1,"attack":5,"release":50,"level_out":0}}]}'></hf-audio-group>
      <audio id="voz-t1" data-audio-group="voz" src="audio/voz-t1.mp3" data-start="0.2" data-duration="2.6" data-track-index="10" data-volume="1"></audio>
      <audio id="voz-t2" data-audio-group="voz" src="audio/voz-t2.mp3" data-start="3.2" data-duration="5.5" data-track-index="10" data-volume="1"></audio>
      <audio id="voz-t3" data-audio-group="voz" src="audio/voz-t3.mp3" data-start="9.5" data-duration="5.0" data-track-index="10" data-volume="1"></audio>
      <audio id="voz-t4" data-audio-group="voz" src="audio/voz-t4.mp3" data-start="15.6" data-duration="3.5" data-track-index="10" data-volume="1"></audio>

      <audio id="musica" data-audio-group="musica" src="audio/musica.mp3" data-start="0" data-duration="20" data-track-index="11" data-volume="0.46"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":0.46},{"t":19.0,"v":0.46},{"t":20,"v":0}]}]}'></audio>

      <audio id="sfx-imp" data-audio-group="sfx" src="assets/sfx/impresora.mp3" data-start="0.1" data-duration="1.6" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-gol" data-audio-group="sfx" src="assets/sfx/golpe-sordo.mp3" data-start="1.7" data-duration="0.9" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-sel" data-audio-group="sfx" src="assets/sfx/sello.mp3" data-start="6.8" data-duration="0.8" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-cor" data-audio-group="sfx" src="assets/sfx/cortina-luz.mp3" data-start="9.2" data-duration="1.3" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-not" data-audio-group="sfx" src="assets/sfx/notificacion.mp3" data-start="12.2" data-duration="0.6" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-int" data-audio-group="sfx" src="assets/sfx/interruptor.mp3" data-start="14.2" data-duration="0.5" data-track-index="12" data-volume="0.65"></audio>
      <audio id="sfx-tec" data-audio-group="sfx" src="assets/sfx/tecleo.mp3" data-start="15.7" data-duration="1.3" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-env" data-audio-group="sfx" src="assets/sfx/envio.mp3" data-start="17.2" data-duration="0.7" data-track-index="12" data-volume="0.7"></audio>
    </div>

    <script>
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(202611202);
      const caja = document.getElementById("particulas");
      const particulas = [];
      for (let i = 0; i < 28; i++) {
        const p = document.createElement("div");
        p.className = "particula";
        const tam = 3 + rnd() * 6;
        p.style.width = tam + "px"; p.style.height = tam + "px";
        p.style.left = Math.round(rnd() * 1080) + "px"; p.style.top = Math.round(rnd() * 1920) + "px";
        p.style.opacity = (0.25 + rnd() * 0.5).toFixed(2);
        caja.appendChild(p);
        particulas.push({ el: p, dy: -(140 + rnd() * 260), dx: (rnd() - 0.5) * 120 });
      }
      const D = 20;
      const tl = gsap.timeline({ paused: true });
      tl.to("#halo-vino", { x: 150, y: 110, scale: 1.12, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#halo-oro", { x: -130, y: -90, scale: 1.16, duration: D / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      particulas.forEach((p) => tl.to(p.el, { y: p.dy, x: p.dx, duration: D, ease: "none" }, 0));
      tl.fromTo("#camara", { scale: 1, rotation: -0.7 }, { scale: 1.04, rotation: 0.7, duration: D, ease: "sine.inOut" }, 0);

      function subtitulo(id, inicio, fin) {
        tl.set("#" + id, { opacity: 1 }, inicio);
        tl.fromTo("#" + id + " span", { y: 20, rotationX: -70, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.42, ease: "back.out(1.5)", stagger: 0.1 }, inicio);
        tl.to("#" + id, { opacity: 0, duration: 0.25, ease: "power2.in" }, fin - 0.25);
      }
      subtitulo("sub-t1", 0.2, 3.15);
      subtitulo("sub-t2", 3.2, 9.35);
      subtitulo("sub-t3", 9.5, 15.45);
      subtitulo("sub-t4", 15.6, 20.0);
      window.__timelines["lote1-r2-comision"] = tl;
    </script>
  </body>
</html>
