<!-- ESCENA: GANCHO PREGUNTA -->
<div class="escena escena-gancho-pregunta" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro">
    <div class="badge-categoria" style="background:var(--vino); color:var(--oro); padding:12px 28px; border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:700; text-transform:uppercase; letter-spacing:2px; display:inline-block; margin-bottom:40px;">
      {{categoria}}
    </div>
    <h1 class="titulo-gancho" style="font-family:var(--font-display); font-size:var(--text-2xl); font-weight:900; line-height:1.05; letter-spacing:-2px; margin-bottom:30px;">
      {{pregunta}}
    </h1>
    <p class="subtitulo-gancho" style="font-family:var(--font-body); font-size:var(--text-lg); color:var(--gris-texto); line-height:1.25;">
      {{subtitulo}}
    </p>
  </div>
</div>
