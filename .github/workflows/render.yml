# Renderizado de piezas (HyperFrames + OpenMontage) con generación de audio ElevenLabs y QC estricto
# DKitchen Studio - Calidad Gran Reserva
name: Renderizar reel
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: Carpeta de la pieza (contiene composicion.html)
        required: true
        default: reels/reel-01
      fps:
        description: Fotogramas por segundo (estándar DKitchen = 30)
        required: false
        default: '30'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Instalar dependencias
        run: |
          npm i playwright ffmpeg-static @elevenlabs/elevenlabs-js
          npx playwright install --with-deps chromium
          pip install google-api-python-client google-auth

      - name: Generar Audio con ElevenLabs (Voz de Marca y Música)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -f "scripts/generar_audio_pieza.cjs" ]; then
            node scripts/generar_audio_pieza.cjs "${{ inputs.carpeta }}"
          else
            echo "[AVISO] No se encontró scripts/generar_audio_pieza.cjs. Saltando generación de voz."
          fi

      - name: Renderizar vídeo y generar Control de Calidad
        run: node renderizar.cjs "${{ inputs.carpeta }}" "${{ inputs.fps }}"

      - name: Entregar a Google Drive (Estricto para producción)
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/entrega_drive.py "${{ inputs.carpeta }}"

      - name: Guardar artefactos en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: entrega-${{ github.run_id }}
          path: |
            ${{ inputs.carpeta }}/reel.mp4
            ${{ inputs.carpeta }}/contact_sheet.jpg
            ${{ inputs.carpeta }}/control_calidad.txt