name: Fusionar OpenMontageArchitect
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dkitchen-video
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar git
        run: |
          git config user.name "Antigravity Studio"
          git config user.email "dkitchencorporate@gmail.com"
      - name: Añadir remote y fusionar
        run: |
          git remote add openmontage https://github.com/dkitchencorporate-tech/OpenMontageArchitect.git
          git fetch openmontage main
          git merge openmontage/main --allow-unrelated-histories -s ort -X ours -m "Integrar OpenMontageArchitect conservando licencias (AGPL-3.0)"
          if [ -f .github/workflows/ci.yml ]; then
            git rm .github/workflows/ci.yml
            git commit --amend --no-edit
          fi
      - name: Push a main
        run: |
          git push origin main