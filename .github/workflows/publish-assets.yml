name: Publicar Assets de Video y Contact Sheet
on:
  workflow_dispatch:
jobs:
  publish-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar artefactos de reels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public-assets
          
          # Descargar reel-01 (run 37132994500)
          gh run download 37132994500 --repo dkitchencorporate-tech/dkitchen-video --name entrega-37132994500 --dir temp-reel01
          mv temp-reel01/reel.mp4 public-assets/reel-01.mp4
          mv temp-reel01/contact_sheet.jpg public-assets/reel-01-sheet.jpg
          
          # Descargar reel-02 (run 37164540189)
          gh run download 37164540189 --repo dkitchencorporate-tech/dkitchen-video --name entrega-37164540189 --dir temp-reel02
          mv temp-reel02/reel.mp4 public-assets/reel-02.mp4
          mv temp-reel02/contact_sheet.jpg public-assets/reel-02-sheet.jpg
          
          ls -la public-assets/
      - name: Crear o actualizar Release para CDN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 public-assets/* --title "DKitchen Studio Media Assets v1.0.0" --notes "Videos MP4 y hojas de contacto para reproducción en streaming."