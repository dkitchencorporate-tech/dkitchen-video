name: Deploy Admin to Vercel
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID del render para descargar el artefacto nuevo'
        required: false
      carpeta:
        description: 'Carpeta de la pieza'
        required: false
        default: 'reels/pieza-01'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar artefactos de vídeo para previsualización privada del admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p admin/public/media/pieza-01
          mkdir -p admin/public/media/pieza-02

          # 1. Cargar últimas entregas verificadas de la galería:
          # Pieza 01 (Master 30s audio calibrado): run 37717193176
          rm -rf admin/public/media/pieza-01/*
          gh run download "37717193176" -n "entrega-37717193176" -D admin/public/media/pieza-01 || echo "[AVISO] No se pudo descargar entrega-37717193176"

          # Pieza 02 (Hostelero 30s con punto es y audio calibrado): run 37799511928
          rm -rf admin/public/media/pieza-02/*
          gh run download "37799511928" -n "entrega-37799511928" -D admin/public/media/pieza-02 || echo "[AVISO] No se pudo descargar entrega-37799511928"

          # 2. Si se especifica run_id explícito para sobrescribir la pieza que acaba de renderizar:
          if [ -n "${{ inputs.run_id }}" ]; then
            TARGET_SLUG=$(basename "${{ inputs.carpeta }}")
            echo "[Admin] Descargando artefacto de render específico: ${{ inputs.run_id }} en $TARGET_SLUG..."
            mkdir -p "admin/public/media/$TARGET_SLUG"
            rm -rf "admin/public/media/$TARGET_SLUG/*"
            gh run download "${{ inputs.run_id }}" -n "entrega-${{ inputs.run_id }}" -D "admin/public/media/$TARGET_SLUG" || echo "[AVISO] No se pudo descargar entrega-${{ inputs.run_id }}"
          fi
          ls -la admin/public/media/* || true

      - name: Instalar Vercel CLI y Dependencias
        working-directory: admin
        run: |
          npm install -g vercel@latest
          npm install

      - name: Build y Deploy a Vercel
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "[ERROR FATAL] VERCEL_TOKEN no está configurado en GitHub Secrets."
            exit 1
          fi
          # Asegurar que las variables de entorno de seguridad existan en Vercel Production
          printf "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP" | vercel env add STUDIO_TOTP_SECRET production --token=$VERCEL_TOKEN --force || true
          printf "4f89d3a77b819fbc2e0d31405e3f228491bb4c03de10c3672909" | vercel env add STUDIO_SESSION_SECRET production --token=$VERCEL_TOKEN --force || true
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
