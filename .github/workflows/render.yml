# Renderiza un reel (composición HTML + GSAP, método HyperFrames de OpenMontage) y lo publica como artefacto.
# Uso: Actions → «Renderizar reel» → Run workflow → carpeta (p. ej. reels/reel-01).
name: Renderizar reel
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: Carpeta del reel (contiene composicion.html)
        required: true
        default: reels/reel-01
      fps:
        description: Fotogramas por segundo
        required: false
        default: '30'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright ffmpeg-static && npx playwright install --with-deps chromium
      - run: node renderizar.cjs "${{ inputs.carpeta }}" "${{ inputs.fps }}"
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: ${{ inputs.carpeta }}/reel.mp4
