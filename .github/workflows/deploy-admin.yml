name: Deploy Admin to Vercel
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID del render para descargar el artefacto nuevo (opcional; si se omite, toma el último de cada pieza)'
        required: false
      carpeta:
        description: 'Carpeta de la pieza'
        required: false
        default: 'reels/pieza-01'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar artefactos de vídeo (TODAS las piezas de admin/medios.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_CARPETA: ${{ inputs.carpeta }}
        run: |
          # Cada pieza se descarga de SU render; un run_id nuevo solo sustituye la entrada de su carpeta.
          node scripts/medios_admin.cjs "$(basename "$INPUT_CARPETA")" "$INPUT_RUN" | while read SLUG RID; do
            mkdir -p "admin/public/media/$SLUG"
            echo "[Admin] $SLUG <- entrega-$RID"
            gh run download "$RID" -n "entrega-$RID" -D "admin/public/media/$SLUG" || echo "[AVISO] No se pudo descargar entrega-$RID para $SLUG"
          done
          ls -la admin/public/media/* || true

      - name: Instalar Vercel CLI y Dependencias
        working-directory: admin
        run: |
          npm install -g vercel@latest
          npm install

      - name: Build y Deploy a Vercel
        working-directory: admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "[ERROR FATAL] VERCEL_TOKEN no está configurado en GitHub Secrets."
            exit 1
          fi
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
