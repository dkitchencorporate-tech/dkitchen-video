<!-- ESCENA: CTA FINAL -->
<div class="escena escena-cta-final" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro" style="text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
    <div style="margin-bottom:36px;">
      <svg width="260" height="65" viewBox="0 0 400 100">
        <rect x="10" y="15" width="70" height="70" rx="18" fill="#6E0C2B" />
        <path d="M30 32 L50 32 C58 32 64 38 64 50 C64 62 58 68 50 68 L30 68 Z" fill="none" stroke="#D9B25C" stroke-width="6" stroke-linejoin="round" />
        <path d="M42 32 L42 68" stroke="#D9B25C" stroke-width="6" stroke-linecap="round" />
        <text x="100" y="65" font-family="'Bricolage Grotesque', 'Inter', sans-serif" font-size="52" font-weight="900" fill="{{color}}" letter-spacing="-1.5">DKitchen</text>
      </svg>
    </div>
    <h2 style="font-family:var(--font-display); font-size:var(--text-2xl); font-weight:900; line-height:1.1; margin-bottom:36px;">
      {{accion}}
    </h2>
    <div style="background:var(--vino); color:var(--oro); padding:24px 64px; border-radius:var(--radius-full); font-family:var(--font-display); font-size:var(--text-lg); font-weight:900; box-shadow:var(--shadow-oro); margin-bottom:28px;">
      {{boton_texto}}
    </div>
    <div style="font-family:var(--font-body); font-size:var(--text-base); color:var(--oro); font-weight:700; margin-bottom:12px;">
      {{url_visible}}
    </div>
    <div style="font-size:var(--text-xs); color:var(--gris-texto);">
      {{legal_cta}}
    </div>
  </div>
</div>
