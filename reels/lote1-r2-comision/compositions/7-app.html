<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena 7</title></head>
  <body>
    <template id="7-app">
      <style>
        @font-face { font-family: 'Bricolage Grotesque'; src: url('marca/fuentes/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
        #root { position: absolute; inset: 0; perspective: 1200px; display: flex; align-items: center; justify-content: center; }
        #bg-blur { position: absolute; inset: 0; filter: blur(20px); transform: scale(1.1); }
        #movil { width: 390px; height: 844px; border-radius: 40px; border: 12px solid #222; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; position: relative; background: #fff; transform-style: preserve-3d; }
        #sello { position: absolute; top: 300px; right: -50px; width: 200px; height: 200px; background: #FF5A82; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 50px; color: #fff; transform: rotate(-15deg); box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 10; }
        #sello.oro { background: #D9B25C; color: #6E0C2B; }
      </style>
      <div id="root" data-composition-id="7-app" data-width="1080" data-height="1920">
        <video id="bg-vid" src="assets/f5-local-lleno.mp4" width="1080" height="1920" style="object-fit: cover;" data-start="0.0" data-duration="1.8" muted></video>
        <div id="movil">
          <video id="movil-vid" src="assets/g1-signature.mp4" width="390" height="844" style="object-fit: cover;" data-start="0.0" data-duration="1.8" muted></video>
          <div id="sello">−30 %</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#movil", { rotationY: 20, rotationX: 10, scale: 0.8 }, { rotationY: 0, rotationX: 0, scale: 1.2, duration: 1.5, ease: "power2.out" }, 0);

        tl.to("#sello", {
            rotationY: 360,
            scale: 1.2,
            duration: 0.6,
            ease: "power2.inOut",
            onComplete: () => {
               const sello = document.getElementById("sello");
               sello.innerHTML = "0 %";
               sello.classList.add("oro");
            }
        }, 0.5);
        tl.to("#sello", { scale: 1.0, duration: 0.2 }, 1.1);

        window.__timelines["7-app"] = tl;
      </script>
    </template>
  </body>
</html>
