<!-- ESCENA: TARJETAS FLOTANTES 3D -->
<div class="escena escena-tarjetas-flotantes-3d" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro">
    <h2 style="font-family:var(--font-display); font-size:var(--text-xl); font-weight:900; margin-bottom:40px; text-align:center;">
      {{titulo}}
    </h2>
    <div class="tarjetas-stack" style="display:flex; flex-direction:column; gap:24px;">
      {{tarjetas_html}}
    </div>
  </div>
</div>
