<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena 4</title></head>
  <body>
    <template id="4-calendario">
      <style>
        @font-face { font-family: 'Bricolage Grotesque'; src: url('marca/fuentes/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
        #root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: 1200px; }
        .texto-bricolage { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 80px; color: #F7F5F2; text-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 10; position: relative; }
        .hoja { position: absolute; width: 100px; height: 120px; background: #F7F5F2; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
      </style>
      <div id="root" data-composition-id="4-calendario" data-width="1080" data-height="1920">
        <video id="vid" src="assets/f3-cocina.mp4" width="1080" height="1920" style="object-fit: cover;" data-start="0.0" data-duration="1.6" muted></video>
        <div id="hojas-container"></div>
        <div id="texto" class="texto-bricolage">× 30 días = 9.000 €</div>
      </div>
      <script>
        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        const rand = mulberry32(12345);

        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#texto", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.5);

        const container = document.getElementById("hojas-container");
        for(let i=0; i<6; i++) {
           const hoja = document.createElement("div");
           hoja.className = "hoja";
           container.appendChild(hoja);
           tl.fromTo(hoja,
               { x: -500, y: rand()*400 - 200, rotationZ: rand()*60 - 30, rotationY: rand()*180, opacity: 1 },
               { x: 500, y: rand()*400 - 200, rotationZ: rand()*60 - 30, rotationY: rand()*180, opacity: 0, duration: 0.8, ease: "power1.inOut" },
               i * 0.1
           );
        }
        window.__timelines["4-calendario"] = tl;
      </script>
    </template>
  </body>
</html>
