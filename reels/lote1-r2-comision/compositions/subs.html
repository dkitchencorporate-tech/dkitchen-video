<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Subtítulos</title></head>
  <body>
    <template id="subs">
      <style>
        @font-face { font-family: 'Inter'; src: url('marca/fuentes/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
        #root { position: absolute; left: 60px; right: 140px; top: 1400px; bottom: 420px; pointer-events: none; z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
        .sub-grupo { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; position: absolute; opacity: 0; }
        .sub-grupo.active { opacity: 1; }
        .sub-linea { background: rgba(5,4,6,0.85); padding: 8px 24px; border-radius: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 42px; line-height: 1.2; text-align: center; color: #F7F5F2; border: 1px solid rgba(247,245,242,0.1); backdrop-filter: blur(8px); }
        .sub-linea span { display: inline-block; opacity: 0; transform: translateY(10px); }
        .sub-linea span.hl { color: #D9B25C; }
      </style>
      <div id="root" data-composition-id="subs" data-width="1080" data-height="1920" data-layout-allow-overflow>
        <div id="sub-t1" class="sub-grupo">
           <div class="sub-linea"><span id="w1">¿Sabes</span> <span id="w2">cuánto</span> <span id="w3">te</span> <span id="w4">quedas</span></div>
           <div class="sub-linea"><span id="w5">de</span> <span id="w6">cada</span> <span id="w7">pedido</span> <span id="w8">de</span> <span id="w9" class="hl">veinte euros?</span></div>
        </div>
        <div id="sub-t2" class="sub-grupo">
           <div class="sub-linea"><span id="w10">Si</span> <span id="w11">vendes</span> <span id="w12" class="hl">trescientos euros</span> <span id="w13">al</span> <span id="w14">día</span></div>
           <div class="sub-linea"><span id="w15">por</span> <span id="w16">plataformas,</span> <span id="w17">pagas</span> <span id="w18">unos</span></div>
           <div class="sub-linea"><span id="w19" class="hl">dos mil setecientos</span> <span id="w20">al</span> <span id="w21">mes</span> <span id="w22">de</span> <span id="w23">comisión.</span></div>
        </div>
        <div id="sub-t3" class="sub-grupo">
           <div class="sub-linea"><span id="w24">Con</span> <span id="w25">tu</span> <span id="w26">propia</span> <span id="w27">carta</span> <span id="w28">y</span> <span id="w29">tu</span> <span id="w30">app,</span></div>
           <div class="sub-linea"><span id="w31">ese</span> <span id="w32">dinero</span> <span id="w33">se</span> <span id="w34">queda</span> <span id="w35">en</span> <span id="w36">tu</span> <span id="w37">local.</span></div>
        </div>
        <div id="sub-t4" class="sub-grupo">
           <div class="sub-linea"><span id="w38">Escríbenos</span> <span id="w39" class="hl">CARTA</span></div>
           <div class="sub-linea"><span id="w40">y</span> <span id="w41">te</span> <span id="w42">enseñamos</span> <span id="w43">cuánto</span> <span id="w44">ahorras.</span></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });

        // Simular las ventanas de los tramos
        tl.to("#sub-t1", { opacity: 1, duration: 0.1 }, 0.2);
        tl.to("#sub-t1", { opacity: 0, duration: 0.1 }, 3.1);

        tl.to("#sub-t2", { opacity: 1, duration: 0.1 }, 3.2);
        tl.to("#sub-t2", { opacity: 0, duration: 0.1 }, 9.1);

        tl.to("#sub-t3", { opacity: 1, duration: 0.1 }, 9.5);
        tl.to("#sub-t3", { opacity: 0, duration: 0.1 }, 14.9);

        tl.to("#sub-t4", { opacity: 1, duration: 0.1 }, 15.6);
        tl.to("#sub-t4", { opacity: 0, duration: 0.1 }, 19.4);

        for(let i=1; i<=44; i++) {
           const w = document.getElementById("w"+i);
           if(w) {
              let start = 0;
              if(i<=9) start = 0.2 + (i*0.25);
              else if(i<=23) start = 3.2 + ((i-9)*0.3);
              else if(i<=37) start = 9.5 + ((i-23)*0.3);
              else start = 15.6 + ((i-37)*0.3);
              tl.to(w, { opacity: 1, y: 0, duration: 0.2, ease: "power1.out" }, start);
           }
        }
        window.__timelines["subs"] = tl;
      </script>
    </template>
  </body>
</html>
