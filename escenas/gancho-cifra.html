<!-- ESCENA: GANCHO CIFRA -->
<div class="escena escena-gancho-cifra" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro" style="text-align:center;">
    <div class="cifra-destacada" style="font-family:var(--font-display); font-size:var(--text-hero); font-weight:900; color:var(--oro); line-height:1; margin-bottom:20px; text-shadow:var(--shadow-oro);">
      {{cifra}}
    </div>
    <div class="etiqueta-cifra" style="font-family:var(--font-display); font-size:var(--text-xl); font-weight:800; line-height:1.1; margin-bottom:30px;">
      {{texto}}
    </div>
    <p class="aclaracion-cifra" style="font-family:var(--font-body); font-size:var(--text-base); color:var(--gris-texto); max-width:760px; margin:0 auto;">
      {{aclaracion}}
    </p>
  </div>
</div>
