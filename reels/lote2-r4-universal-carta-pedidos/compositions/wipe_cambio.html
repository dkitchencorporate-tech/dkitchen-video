<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><title>Cambio en 4 s</title></head><body>
<template id="wipe_cambio">
  <style>
    #root { position: absolute; inset: 0; }
    #wc-bg { position: absolute; inset: -60px; background-image: url('assets/media/bg-tapas-barra.jpg'); background-size: cover; background-position: center; filter: blur(12px) brightness(0.38); }
    #wc-tit { position: absolute; left: 95px; right: 175px; top: 266px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1.04; color: #F7F5F2; }
    #wc-tit em { font-family: 'Cormorant Garamond', serif; font-style: italic; color: #F0C96F; font-size: 78px; }
    #wc-crono { position: absolute; left: 375px; top: 356px; width: 250px; text-align: center; padding: 8px 20px; border-radius: 999px; background: rgba(16,13,18,0.9); border: 2px solid #D9B25C; font-family: var(--font-display); font-weight: 800; font-size: 32px; color: #F0C96F; font-variant-numeric: tabular-nums; }
    #wc-esc { position: absolute; left: 265px; top: 430px; width: 470px; height: 730px; perspective: 1400px; }
    #wc-movil { position: absolute; inset: 0; transform-style: preserve-3d; border-radius: 58px; background: linear-gradient(145deg, #2b2429, #0c0a0d 45%, #1d181c); padding: 12px; box-shadow: 0 46px 90px rgba(0,0,0,0.92), 0 0 0 2.5px rgba(217,178,92,0.5); }
    #wc-screen { position: relative; width: 446px; height: 706px; border-radius: 48px; overflow: hidden; background: #110D10; }
    #wc-isla { position: absolute; left: 163px; top: 14px; width: 120px; height: 28px; border-radius: 18px; background: #000; z-index: 12; }
    #wc-hdr { padding: 50px 22px 14px; background: #1A1217; border-bottom: 1.5px solid rgba(217,178,92,0.3); display: flex; justify-content: space-between; align-items: center; }
    #wc-hdr b { font-family: var(--font-display); font-size: 29px; color: #F0C96F; }
    #wc-hdr span { font-family: var(--font-body); font-size: 28px; font-weight: 700; color: #34D399; }
    .wc-card { margin: 16px 20px 0; border-radius: 22px; overflow: hidden; background: #1E171C; border: 1.5px solid rgba(247,245,242,0.14); }
    .wc-top { display: flex; align-items: center; gap: 14px; padding: 14px; }
    .wc-top img { width: 128px; height: 112px; border-radius: 16px; object-fit: cover; flex-shrink: 0; }
    .wc-top div b { display: block; font-family: var(--font-display); font-size: 28px; color: #F7F5F2; line-height: 1.1; }
    #wc-price-pill { margin-top: 10px; display: inline-block; padding: 8px 20px; border-radius: 14px; background: #6E0C2B; border: 2px solid #D9B25C; font-family: var(--font-display); font-weight: 800; font-size: 32px; color: #F0C96F; font-variant-numeric: tabular-nums; }
    #wc-tgl-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid rgba(247,245,242,0.12); font-family: var(--font-body); font-size: 28px; font-weight: 700; }
    #wc-tgl-track { width: 92px; height: 48px; border-radius: 999px; background: #10B981; padding: 5px; display: flex; align-items: center; }
    #wc-tgl-knob { width: 38px; height: 38px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.4); }
    #wc-ripple { position: absolute; left: 260px; top: 195px; width: 68px; height: 68px; border-radius: 50%; border: 5px solid #F0C96F; background: rgba(240,201,111,0.3); opacity: 0; }
    #wc-ripple2 { position: absolute; left: 328px; top: 410px; width: 68px; height: 68px; border-radius: 50%; border: 5px solid #FF5A82; background: rgba(255,90,130,0.3); opacity: 0; }
    #wc-saved { margin: 18px 20px 0; padding: 16px 20px; border-radius: 18px; background: rgba(16,185,129,0.18); border: 2px solid #10B981; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 28px; color: #34D399; opacity: 0; }
  </style>
  <div id="root" data-composition-id="wipe_cambio" data-width="1080" data-height="1920">
    <div id="wc-bg" data-layout-allow-overflow></div>
    <div id="wc-tit" data-layout-allow-occlusion>Cambia en <em>4 segundos</em></div>
    <div id="wc-crono" data-layout-allow-occlusion>00:00 s</div>
    <div id="wc-esc">
      <div id="wc-movil" data-layout-allow-occlusion>
        <div id="wc-screen">
          <div id="wc-isla"></div>
          <div id="wc-hdr"><b>Panel del Dueño</b><span>En directo</span></div>
          <div class="wc-card">
            <div class="wc-top">
              <img src="assets/media/plato-tortilla-trufa.jpg" alt="" />
              <div><b>Tortilla de trufa</b><span id="wc-price-pill">13,50 €</span></div>
            </div>
          </div>
          <div class="wc-card">
            <div class="wc-top">
              <img src="assets/media/plato-pipirrana.jpg" alt="" />
              <div><b>Pipirrana bacalao</b><span style="display:block;margin-top:6px;font-size:28px;color:#D9B25C;">10,50 €</span></div>
            </div>
            <div id="wc-tgl-row"><span id="wc-tgl-txt" style="position:relative;display:inline-block;width:210px;height:34px;"><b id="wc-tgl-on" style="position:absolute;left:0;top:0;color:#34D399;">Disponible</b><b id="wc-tgl-off" style="position:absolute;left:0;top:0;color:#FF5A82;opacity:0;">Agotado hoy</b></span><div id="wc-tgl-track"><div id="wc-tgl-knob"></div></div></div>
          </div>
          <div id="wc-saved">✓ Actualizado en todas las mesas</div>
          <div id="wc-ripple"></div>
          <div id="wc-ripple2"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const crono = document.getElementById("wc-crono");
    const price = document.getElementById("wc-price-pill");
    const clk = { s: 0 }, pr = { v: 13.5 };
    tl.fromTo("#wc-bg", { scale: 1.06 }, { scale: 1.0, duration: 5.3, ease: "sine.inOut" }, 0);
    tl.fromTo("#wc-tit, #wc-crono", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.6)", stagger: 0.08 }, 0.05);
    tl.fromTo("#wc-movil", { rotationY: 16, rotationX: 5, scale: 0.88 }, { rotationY: -6, rotationX: 2, scale: 0.94, duration: 5.2, ease: "sine.inOut" }, 0);
    tl.to(clk, { s: 4, duration: 4.0, ease: "none", onUpdate: () => { crono.textContent = "00:0" + Math.min(4, Math.floor(clk.s)) + " s"; } }, 0.4);
    tl.fromTo("#wc-ripple", { scale: 0.3, opacity: 1 }, { scale: 2.3, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.2);
    tl.to(pr, { v: 14.5, duration: 0.55, ease: "power2.out", onUpdate: () => { price.textContent = pr.v.toFixed(2).replace(".", ",") + " €"; } }, 1.3);
    tl.fromTo("#wc-ripple2", { scale: 0.3, opacity: 1 }, { scale: 2.3, opacity: 0, duration: 0.5, ease: "power2.out" }, 2.4);
    tl.to("#wc-tgl-knob", { x: 44, duration: 0.28, ease: "power2.out" }, 2.5);
    tl.to("#wc-tgl-track", { backgroundColor: "#FF5A82", duration: 0.28 }, 2.5);
    tl.to("#wc-tgl-on", { opacity: 0, duration: 0.16 }, 2.55);
    tl.to("#wc-tgl-off", { opacity: 1, duration: 0.16 }, 2.6);
    tl.fromTo("#wc-saved", { y: 20, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 3.3);
    tl.to("#wc-tit, #wc-crono", { y: -20, opacity: 0, duration: 0.28, ease: "power2.in" }, 4.95);
    window.__timelines["wipe_cambio"] = tl;
  </script>
</template></body></html>
