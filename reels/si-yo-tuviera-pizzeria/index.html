<script>
window.__timelines = window.__timelines || {};

const CAP = {

  v2: 'Una pizza de 15 € por plataforma: con hasta un 30 % de comisión, me quedan 10,50 €.',
  v3: 'Así que crearía una dinámica. Cada 5 pedidos directos… la sexta pizza, gratis.',
  v4: 'Y aquí está lo interesante.',
  v5: 'Esa pizza gratis me cuesta unos 3 € de ingredientes. Repartidos en 5 pedidos: 0,60 € por pedido.',
  v6: 'Pidiendo directo, me quedo 14,40 € en vez de 10,50 €. Casi 4 € más por pizza.',
  v7: 'Con 300 pedidos al mes… son más de 1.000 €.',

// Subtítulo palabra a palabra (las cifras van unidas a su símbolo y en dorado)
const cap = document.getElementById('cap'); const OSCURO = ['v3','v4'];
Object.entries(CAP).forEach(([id, txt]) => {
  const t = T[id]; if (!t) return;
  const pal = txt.replace(/ (€|%)/g, ' $1').split(' ');
  const pesos = pal.map(p => Math.max(2, p.replace(/[^\p{L}\p{N}]/gu, '').length));
  const total = pesos.reduce((a, b) => a + b, 0); let acc = 0;
  pal.forEach((p, i) => {
    const s = document.createElement('span'); s.className = 'w' + (/\d/.test(p) ? ' n' : ''); s.textContent = p; cap.appendChild(s);
    const ini = t.s + t.d * (acc / total); acc += pesos[i]; const fin = t.s + t.d * (acc / total);
    const col = OSCURO.includes(id) ? (/\d/.test(p) ? '#6E0C2B' : '#0A080C') : (/\d/.test(p) ? '#D9B25C' : '#F7F5F2');
    tl.set(s, { opacity: 1, color: col, textShadow: OSCURO.includes(id) ? 'none' : '0 6px 30px rgba(0,0,0,.75)' }, ini);
    tl.fromTo(s, { scale: 1.18 }, { scale: 1, duration: .14, ease: 'power2.out' }, ini);
    tl.set(s, { opacity: 0 }, i === pal.length - 1 ? Math.min(fin + .25, t.s + t.d + .25) : fin);
  });
});
const entra = (sel, t) => tl.set(sel, { opacity: 1 }, t);
const sale = (sel, t) => tl.set(sel, { opacity: 0 }, t);
const S = (id) => T[id].s;
