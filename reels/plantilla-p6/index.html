<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DKitchen · plantilla P6</title>
    <!-- PLANTILLA P6 DKITCHEN (P6_GUIA_PRODUCCION.md §4). Copiar la carpeta entera a reels/<pieza>/ y editar solo:
         1) escenas en compositions/*.html (una subcomposición por escena),
         2) un <audio id="voz-<tramo>"> por tramo de guion.json (mismo id y mismo inicio),
         3) los grupos de subtítulos de #subs (uno por tramo),
         4) data-duration de la raíz = guion.json.duracion.
         marca/ y audio/*.mp3 los pone Actions (scripts/hf/producir.cjs): no se suben a mano. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="marca/tokens.css" />
    <link rel="stylesheet" href="marca/fuentes.css" />
    <style>
      /* Fuentes locales también aquí, en el propio archivo (lint font_family_without_font_face) */
      @font-face { font-family: 'Bricolage Grotesque'; src: url('marca/fuentes/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('marca/fuentes/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('marca/fuentes/cormorant-garamond-latin.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: block; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('marca/fuentes/cormorant-garamond-italic-latin.woff2') format('woff2'); font-weight: 300 700; font-style: italic; font-display: block; }
      body { margin: 0; background: #050406; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050406; font-family: var(--font-body); color: var(--papel); }
      /* Atmósfera: nunca negro plano (directriz 1.2) */
      #fondo { position: absolute; inset: 0; }
      .halo { position: absolute; border-radius: 50%; filter: blur(60px); }
      #halo-vino { width: 1400px; height: 1400px; left: -420px; top: -260px; background: radial-gradient(circle, rgba(110,12,43,0.85) 0%, rgba(22,14,24,0) 70%); }
      #halo-oro { width: 1100px; height: 1100px; left: 260px; top: 1040px; background: radial-gradient(circle, rgba(217,178,92,0.38) 0%, rgba(14,12,18,0) 70%); }
      #rejilla { position: absolute; inset: 0; opacity: 0.15; background-image: radial-gradient(rgba(247,245,242,0.55) 1.5px, transparent 1.5px); background-size: 36px 36px; }
      .particula { position: absolute; border-radius: 50%; background: #F0C96F; box-shadow: 0 0 12px rgba(240,201,111,0.8); }
      /* Cámara: envoltorio sin data-start; mueve todo el reel (directriz 1.1) */
      #camara { position: absolute; inset: 0; transform-origin: 50% 45%; }
      /* Subtítulos quemados sin cajas, dentro de la caja segura */
      #subs { position: absolute; left: calc(var(--safe-left) + 20px); right: calc(var(--safe-right) + 20px); bottom: calc(var(--safe-bottom) + 30px); height: 230px; }
      .sub { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; gap: 0 18px; opacity: 0; }
      .sub span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 58px; line-height: 1.12; color: #FFFFFF; text-shadow: 0 4px 18px rgba(5,4,6,0.9), 0 0 2px rgba(5,4,6,1); }
      .sub span.oro { color: #F0C96F; }
      .sub span.vino { color: #FF5A82; }
    </style>
  </head>
  <body>
    <div id="raiz" data-composition-id="plantilla-p6" data-start="0" data-width="1080" data-height="1920" data-duration="15">

      <!-- PISTA 0 · Atmósfera continua -->
      <div id="fondo" class="clip" data-start="0" data-duration="15" data-track-index="0" data-layout-allow-overflow>
        <div id="halo-vino" class="halo"></div>
        <div id="halo-oro" class="halo"></div>
        <div id="rejilla"></div>
        <div id="particulas"></div>
      </div>

      <!-- PISTA 1 · Escenas (una subcomposición por escena) dentro de la cámara -->
      <div id="camara">
        <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html"
             data-start="0" data-duration="7.5" data-track-index="1" data-width="1080" data-height="1920"></div>
        <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
             data-start="7.5" data-duration="7.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      </div>

      <!-- PISTA 2 · Subtítulos (una sola pista; un grupo por tramo de voz) -->
      <div id="subs" class="clip" data-start="0" data-duration="15" data-track-index="2">
        <div class="sub" id="sub-t1"><span>¿Tu</span><span>carta</span><span>sigue</span><span>en</span><span class="vino">papel?</span></div>
        <div class="sub" id="sub-t2"><span>Escríbenos</span><span class="oro">CARTA</span><span>y</span><span>te</span><span>la</span><span>hacemos</span><span class="oro">gratis</span></div>
      </div>

      <!-- AUDIO · Voz: un clip por tramo, todos en el grupo «voz» (bus con una sola cadena, equivalente a voice-clean).
           data-duration la reescribe scripts/hf/audio_pistas.cjs con la duración real de cada locución. -->
      <hf-audio-group id="voz" data-label="Voz" data-volume="1"
        data-fx-chain='{"version":1,"nodes":[{"type":"highpass","id":"v1","label":"Remove Rumble","params":{"frequency":80,"q":0.707,"poles":"2"}},{"type":"peaking","id":"v2","label":"Reduce Mud","params":{"frequency":250,"gain":-3,"q":1.2}},{"type":"compressor","id":"v3","label":"Even Out Loudness","params":{"threshold":-20,"ratio":3,"attack":10,"release":180,"knee":2.83,"makeup":3,"mix":1}},{"type":"peaking","id":"v4","label":"Add Clarity","params":{"frequency":3000,"gain":2.5,"q":1}},{"type":"limiter","id":"v5","label":"Peak Ceiling","params":{"limit":-1,"attack":5,"release":50,"level_out":0}}]}'></hf-audio-group>
      <audio id="voz-t1" data-audio-group="voz" src="audio/voz-t1.mp3" data-start="0.4" data-duration="6" data-track-index="10" data-volume="1"></audio>
      <audio id="voz-t2" data-audio-group="voz" src="audio/voz-t2.mp3" data-start="7.8" data-duration="5" data-track-index="10" data-volume="1"></audio>

      <!-- AUDIO · Música: cama con carve contra el grupo «voz» (carve.mjs lo completa en Actions) + fundidos de entrada y salida -->
      <audio id="musica" data-audio-group="musica" src="audio/musica.mp3" data-start="0" data-duration="15" data-track-index="11" data-volume="0.55"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.8,"v":0.55},{"t":13.8,"v":0.55},{"t":15,"v":0}]}]}'></audio>

      <!-- AUDIO · Efectos en los cortes (grupo «sfx», nunca en el de voz) -->
      <audio id="sfx-whoosh" data-audio-group="sfx" src="marca/sonido/whoosh.mp3" data-start="7.35" data-duration="0.55" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-cierre" data-audio-group="sfx" src="marca/sonido/cierre.mp3" data-start="13.9" data-duration="1.1" data-track-index="12" data-volume="0.8"></audio>
    </div>

    <script>
      // Partículas deterministas (semilla fija, nunca Math.random)
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261031);
      const caja = document.getElementById("particulas");
      const particulas = [];
      for (let i = 0; i < 28; i++) {
        const p = document.createElement("div");
        p.className = "particula";
        const tam = 3 + rnd() * 6;
        p.style.width = tam + "px"; p.style.height = tam + "px";
        p.style.left = Math.round(rnd() * 1080) + "px"; p.style.top = Math.round(rnd() * 1920) + "px";
        p.style.opacity = (0.25 + rnd() * 0.5).toFixed(2);
        caja.appendChild(p);
        particulas.push({ el: p, dy: -(120 + rnd() * 260), dx: (rnd() - 0.5) * 120 });
      }

      const D = 15;
      const tl = gsap.timeline({ paused: true });
      // Halos que respiran (curva sinusoidal, repeticiones finitas)
      tl.to("#halo-vino", { x: 160, y: 120, scale: 1.12, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#halo-oro", { x: -140, y: -90, scale: 1.18, duration: D / 3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
      // Polvo de oro subiendo durante todo el reel
      particulas.forEach((p) => tl.to(p.el, { y: p.dy, x: p.dx, duration: D, ease: "none" }, 0));
      // Cámara: dolly suave + giro de 1,5° (cero estaticidad)
      tl.fromTo("#camara", { scale: 1, rotation: -0.75 }, { scale: 1.045, rotation: 0.75, duration: D, ease: "sine.inOut" }, 0);
      // Subtítulos por tramo: palabra a palabra con rotateX y back.out (directriz 1.4)
      function subtitulo(id, inicio, fin) {
        tl.set("#" + id, { opacity: 1 }, inicio);
        tl.fromTo("#" + id + " span", { y: 22, rotationX: -70, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)", stagger: 0.12 }, inicio);
        tl.to("#" + id, { opacity: 0, duration: 0.25, ease: "power2.in" }, fin - 0.25);
      }
      subtitulo("sub-t1", 0.4, 7.2);
      subtitulo("sub-t2", 7.8, 14.6);
      window.__timelines["plantilla-p6"] = tl;
    </script>
  </body>
</html>
