<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena 9</title></head>
  <body>
    <template id="9-interruptores">
      <style>
        @font-face { font-family: 'Bricolage Grotesque'; src: url('marca/fuentes/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
        #root { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; isolation: isolate; }
        .fila { display: flex; align-items: center; justify-content: space-between; width: 80%; background: rgba(0,0,0,0.4); padding: 40px; border-radius: 30px; backdrop-filter: blur(10px); opacity: 0; transform: scale(0.9); }
        .texto-interruptor { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 50px; color: #F7F5F2; }
        .toggle { width: 120px; height: 60px; background: #333; border-radius: 30px; position: relative; }
        .knob { width: 50px; height: 50px; background: #FFF; border-radius: 50%; position: absolute; top: 5px; left: 5px; }
      </style>
      <div id="root" data-composition-id="9-interruptores" data-width="1080" data-height="1920">
        <video id="vid" src="assets/f6-plato.mp4" width="1080" height="1920" style="object-fit: cover; position: absolute; inset: 0; z-index: -1;" data-start="0.0" data-duration="1.6" muted></video>

        <div class="fila" id="sw1">
           <div class="texto-interruptor">Tu carta</div>
           <div class="toggle"><div class="knob" id="knob1"></div></div>
        </div>
        <div class="fila" id="sw2">
           <div class="texto-interruptor">Tu app</div>
           <div class="toggle"><div class="knob" id="knob2"></div></div>
        </div>
        <div class="fila" id="sw3">
           <div class="texto-interruptor">0 % comisión</div>
           <div class="toggle"><div class="knob" id="knob3"></div></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });

        tl.to("#sw1", { opacity: 1, scale: 1, duration: 0.4 }, 0.2);
        tl.to("#sw1 .toggle", { backgroundColor: "#D9B25C", duration: 0.3 }, 0.4);
        tl.to("#knob1", { x: 60, duration: 0.3 }, 0.4);

        tl.to("#sw2", { opacity: 1, scale: 1, duration: 0.4 }, 0.6);
        tl.to("#sw2 .toggle", { backgroundColor: "#D9B25C", duration: 0.3 }, 0.8);
        tl.to("#knob2", { x: 60, duration: 0.3 }, 0.8);

        tl.to("#sw3", { opacity: 1, scale: 1, duration: 0.4 }, 1.0);
        tl.to("#sw3 .toggle", { backgroundColor: "#D9B25C", duration: 0.3 }, 1.2);
        tl.to("#knob3", { x: 60, duration: 0.3 }, 1.2);

        window.__timelines["9-interruptores"] = tl;
      </script>
    </template>
  </body>
</html>
