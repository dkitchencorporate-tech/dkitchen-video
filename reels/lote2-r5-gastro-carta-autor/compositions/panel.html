<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena · Panel</title></head>
  <body>
    <template id="panel">
      <style>
        #root { position: absolute; inset: 0; }
        #pan-pal { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 250px; display: flex; justify-content: center; align-items: baseline; gap: 22px; perspective: 1200px; }
        #pan-pal span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 128px; line-height: 0.95; letter-spacing: -4px; color: #F7F5F2; text-shadow: 0 20px 60px rgba(5,4,6,0.75); }
        #pan-pal em { display: inline-block; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 128px; color: #F0C96F; }
        .pan-esc { position: absolute; top: 380px; width: 500px; height: 1082px; perspective: 1400px; left: 290px; }
        .pan-movil { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 0; border-radius: 72px; background: linear-gradient(145deg, #2a2428, #0d0b0e 40%, #1c181b); padding: 14px; box-shadow: 0 60px 120px -20px rgba(0,0,0,0.9), 0 0 0 2px rgba(217,178,92,0.35), inset 0 0 0 2px rgba(255,255,255,0.06); }
        .pan-pantalla { position: relative; width: 472px; height: 1054px; border-radius: 58px; overflow: hidden; background: #0B0A09; }
        .pan-isla { position: absolute; left: 176px; top: 18px; width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 9; }
        #pan-hoja-a { position: absolute; left: 0; top: 16px; width: 472px; }
        #pan-img-panel { position: absolute; inset: 0; width: 472px; height: 1054px; object-fit: cover; object-position: top center; filter: brightness(0.45); }
        #pan-velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,10,9,0.9) 0%, rgba(110,12,43,0.45) 45%, rgba(11,10,9,0.85) 100%); }
        #pan-cab { position: absolute; left: 32px; right: 32px; top: 82px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-body); font-weight: 700; font-size: 26px; color: #F7F5F2; }
        #pan-cab-tit { display: flex; flex-direction: column; gap: 4px; }
        #pan-cab-sub { font-weight: 700; font-size: 22px; color: #F0C96F; letter-spacing: 3px; }
        #pan-campana { width: 62px; height: 62px; border-radius: 50%; background: #6E0C2B; border: 2px solid #D9B25C; display: flex; align-items: center; justify-content: center; }
        #pan-aro { position: absolute; left: 378px; top: 82px; width: 62px; height: 62px; border-radius: 50%; border: 4px solid #F0C96F; opacity: 0; }
        #pan-tarjeta { position: absolute; left: 16px; top: 200px; width: 440px; border-radius: 22px; box-shadow: 0 30px 70px rgba(0,0,0,0.65); }
        #pan-onda { position: absolute; left: 128px; top: 334px; width: 80px; height: 80px; border-radius: 50%; border: 5px solid #F0C96F; background: rgba(240,201,111,0.3); opacity: 0; }
        #pan-sello { position: absolute; left: 36px; right: 36px; top: 452px; padding: 26px 0; border-radius: 22px; background: rgba(11,26,20,0.92); border: 2px solid #10B981; text-align: center; white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 34px; color: #F7F5F2; opacity: 0; }
        #pan-sello b { color: #10B981; }
      </style>

      <div id="root" data-composition-id="panel" data-width="1080" data-height="1920">
        <div id="pan-pal" data-layout-allow-occlusion><span>Mesa</span><em>a sala</em></div>
        <div class="pan-esc">
          <div class="pan-movil" id="pan-movil-a">
            <div class="pan-pantalla">
              <img id="pan-hoja-a" src="assets/capturas/pedido.jpg" alt="" />
              <div class="pan-isla"></div>
            </div>
          </div>
        </div>
        <div class="pan-esc">
          <div class="pan-movil" id="pan-movil-b">
            <div class="pan-pantalla">
              <img id="pan-img-panel" src="assets/capturas/panel.jpg" alt="" />
              <div id="pan-velo"></div>
              <div id="pan-cab">
                <div id="pan-cab-tit">
                  <span id="pan-cab-sub">PANEL DE SALA</span>
                  <span>Servicio en mesa</span>
                </div>
                <div id="pan-campana">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F0C96F" stroke-width="2.2" stroke-linecap="round"><path d="M12 4a7 7 0 0 0-7 7v3h14v-3a7 7 0 0 0-7-7ZM3 17h18M12 2v2" /></svg>
                </div>
              </div>
              <div id="pan-aro"></div>
              <img id="pan-tarjeta" src="assets/capturas/camarero.png" alt="" />
              <div id="pan-onda"></div>
              <div id="pan-sello"><b>✓</b> En cocina · Servicio VIP</div>
              <div class="pan-isla"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#pan-movil-a", { x: 0, rotationY: -6, rotationX: 3, scale: 0.9, opacity: 1 }, { x: -250, rotationY: 22, rotationX: 4, scale: 0.72, opacity: 0.55, duration: 0.6, ease: "power3.inOut" }, 0);
        tl.fromTo("#pan-movil-b", { x: 620, rotationY: -35, scale: 0.8 }, { x: 150, rotationY: -12, scale: 0.86, duration: 0.6, ease: "power3.out" }, 0.05);
        tl.to("#pan-movil-b", { x: 120, rotationY: -6, scale: 0.88, duration: 2.5, ease: "sine.inOut" }, 0.65);
        tl.fromTo("#pan-pal span, #pan-pal em", { y: 40, rotationX: -75, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.5, ease: "back.out(1.5)", stagger: 0.14 }, 0.1);
        tl.fromTo("#pan-tarjeta", { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, 0.45);
        tl.fromTo("#pan-movil-b", { rotation: 0 }, { rotation: 1.5, duration: 0.05, ease: "none", yoyo: true, repeat: 9 }, 0.95);
        tl.fromTo("#pan-aro", { scale: 1, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.95);
        tl.fromTo("#pan-campana", { rotation: -18 }, { rotation: 18, duration: 0.08, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.95);
        tl.fromTo("#pan-onda", { scale: 0.3, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out" }, 2.0);
        tl.fromTo("#pan-tarjeta", { scale: 1 }, { scale: 0.97, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 2.0);
        tl.fromTo("#pan-sello", { y: 30, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 2.2);
        tl.to("#pan-pal", { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.0);
        window.__timelines["panel"] = tl;
      </script>
    </template>
  </body>
</html>
