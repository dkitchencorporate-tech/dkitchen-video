<!-- ESCENA: MOVIL PANTALLA SCROLL -->
<div class="escena escena-movil-pantalla-scroll" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro" style="display:flex; flex-direction:column; align-items:center;">
    <h2 style="font-family:var(--font-display); font-size:var(--text-xl); font-weight:800; text-align:center; margin-bottom:30px;">
      {{titulo}}
    </h2>
    <div class="mockup-scroll-container" style="position:relative; width:650px; height:1050px; border-radius:50px; overflow:hidden; border:14px solid #1C1917; box-shadow:var(--shadow-lg); background:#000;">
      <img class="imagen-scroll" src="{{captura_larga_url}}" style="width:100%; position:absolute; top:0; left:0; transform:translateY({{scroll_y}});" alt="Scroll demo" />
    </div>
  </div>
</div>
