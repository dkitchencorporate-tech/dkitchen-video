<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena 2</title></head>
  <body>
    <template id="2-dueno-ticket">
      <style>
        @font-face { font-family: 'Cormorant Garamond'; src: url('marca/fuentes/cormorant-garamond-italic-latin.woff2') format('woff2'); font-weight: 300 700; font-style: italic; font-display: block; }
        #root { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .texto-oro { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-style: italic; font-size: 140px; color: #D9B25C; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
      </style>
      <div id="root" data-composition-id="2-dueno-ticket" data-width="1080" data-height="1920">
        <video id="vid" src="assets/fx/f2.mp4" width="1080" height="1920" style="object-fit: cover;" data-start="0.0" data-duration="1.6" muted></video>
        <div id="precio" class="texto-oro">20 €</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to("#precio", {
            innerHTML: "14 €",
            snap: { innerHTML: 1 },
            duration: 0.5,
            ease: "power2.out"
        }, 0.5);
        window.__timelines["2-dueno-ticket"] = tl;
      </script>
    </template>
  </body>
</html>
