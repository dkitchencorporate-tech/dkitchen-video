<!-- ESCENA: GANCHO ANTES DESPUES -->
<div class="escena escena-gancho-antes-despues" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro">
    <div class="comparativa-grid" style="display:grid; grid-template-columns:1fr; gap:36px; margin-top:20px;">
      <div class="caja-antes" style="background:#FFF1F2; border:2px dashed #FDA4AF; padding:40px; border-radius:var(--radius-lg);">
        <div style="color:var(--rojo-error); font-weight:800; font-size:var(--text-xs); text-transform:uppercase; letter-spacing:2px; margin-bottom:12px;">{{antes_etiqueta}}</div>
        <div style="font-family:var(--font-display); font-size:var(--text-lg); font-weight:700; color:#881337;">{{antes_texto}}</div>
      </div>
      <div class="caja-despues" style="background:#F0FDF4; border:2px solid #86EFAC; padding:40px; border-radius:var(--radius-lg); box-shadow:var(--shadow-md);">
        <div style="color:var(--verde-ok); font-weight:800; font-size:var(--text-xs); text-transform:uppercase; letter-spacing:2px; margin-bottom:12px;">{{despues_etiqueta}}</div>
        <div style="font-family:var(--font-display); font-size:var(--text-lg); font-weight:800; color:#14532D;">{{despues_texto}}</div>
      </div>
    </div>
  </div>
</div>
