<!-- ESCENA: PRECIO REVEAL -->
<div class="escena escena-precio-reveal" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro" style="text-align:center;">
    <div class="etiqueta-oferta" style="background:var(--vino); color:var(--oro); padding:10px 28px; border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:800; display:inline-block; margin-bottom:30px; letter-spacing:2px; text-transform:uppercase;">
      {{etiqueta}}
    </div>
    <div class="precio-principal" style="font-family:var(--font-display); font-size:var(--text-hero); font-weight:900; color:var(--oro); line-height:1; margin-bottom:12px; text-shadow:var(--shadow-oro);">
      {{precio_grande}}
    </div>
    <div class="condicion-precio" style="font-family:var(--font-display); font-size:var(--text-xl); font-weight:800; margin-bottom:20px;">
      {{precio_subtexto}}
    </div>
    <p class="letra-pequena" style="font-family:var(--font-body); font-size:var(--text-sm); color:var(--gris-texto);">
      {{precio_legal}}
    </p>
  </div>
</div>
