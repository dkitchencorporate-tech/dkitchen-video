<!-- ESCENA: LISTA BENEFICIOS -->
<div class="escena escena-lista-beneficios" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro">
    <div class="badge-categoria" style="background:var(--vino); color:var(--oro); padding:10px 24px; border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:800; display:inline-block; margin-bottom:30px;">
      {{etiqueta}}
    </div>
    <h2 style="font-family:var(--font-display); font-size:var(--text-2xl); font-weight:900; line-height:1.08; margin-bottom:48px;">
      {{titulo}}
    </h2>
    <div class="lista-items" style="display:flex; flex-direction:column; gap:28px;">
      {{items_html}}
    </div>
  </div>
</div>
