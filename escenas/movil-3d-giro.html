<!-- ESCENA: MOVIL 3D GIRO -->
<div class="escena escena-movil-3d-giro" id="{{id}}" style="display:none; position:absolute; width:100%; height:100%; background:{{bg}}; color:{{color}};">
  <div class="contenedor-seguro" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
    <div class="etiqueta-flotante" style="background:var(--vino); color:var(--oro); padding:10px 24px; border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:800; margin-bottom:24px;">
      {{etiqueta}}
    </div>
    <div class="mockup-movil-wrapper" style="position:relative; width:680px; height:1100px; border-radius:54px; padding:18px; background:#1C1917; box-shadow:var(--shadow-lg); border:4px solid #44403C; transform:rotate(-4deg);">
      <div class="mockup-pantalla" style="width:100%; height:100%; border-radius:40px; overflow:hidden; background:#000;">
        <img src="{{captura_url}}" style="width:100%; height:100%; object-fit:cover;" alt="Pantalla DKitchen" />
      </div>
    </div>
    <div class="texto-pie" style="font-family:var(--font-display); font-size:var(--text-lg); font-weight:800; margin-top:36px; text-align:center;">
      {{pie_texto}}
    </div>
  </div>
</div>
