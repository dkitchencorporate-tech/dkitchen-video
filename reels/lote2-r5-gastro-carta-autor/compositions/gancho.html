<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><title>Escena · Gancho</title></head>
  <body>
    <template id="gancho">
      <style>
        #root { position: absolute; inset: 0; }
        #gan-pal { position: absolute; left: var(--safe-left); right: var(--safe-right); top: 250px; display: flex; justify-content: center; gap: 14px; perspective: 1200px; }
        #gan-pal span { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 148px; line-height: 0.92; letter-spacing: -5px; color: #F7F5F2; text-shadow: 0 20px 60px rgba(5,4,6,0.75); }
        #gan-pal span.oro { color: #F0C96F; }
        #gan-esc { position: absolute; left: 290px; top: 380px; width: 500px; height: 1082px; perspective: 1400px; }
        #gan-movil { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 0; border-radius: 72px; background: linear-gradient(145deg, #2a2428, #0d0b0e 40%, #1c181b); padding: 14px; box-shadow: 0 60px 120px -20px rgba(0,0,0,0.9), 0 0 0 2px rgba(217,178,92,0.35), inset 0 0 0 2px rgba(255,255,255,0.06); }
        #gan-pantalla { position: relative; width: 472px; height: 1054px; border-radius: 58px; overflow: hidden; background: #0B0A09; }
        #gan-isla { position: absolute; left: 176px; top: 18px; width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 9; }
        #gan-camara { position: absolute; inset: -60px; background-image: url('assets/capturas/inicio.jpg'); background-size: cover; background-position: center; filter: blur(22px) brightness(0.45) saturate(1.2); }
        #gan-qr-wrap { position: absolute; left: 86px; top: 320px; width: 300px; height: 300px; border-radius: 28px; background: #FFFFFF; padding: 24px; box-sizing: border-box; box-shadow: 0 30px 60px rgba(0,0,0,0.65); }
        .gan-esq { position: absolute; width: 70px; height: 70px; border-color: #F0C96F; border-style: solid; border-width: 0; filter: drop-shadow(0 0 10px rgba(240,201,111,0.8)); }
        #gan-e1 { left: 46px; top: 280px; border-top-width: 8px; border-left-width: 8px; border-top-left-radius: 22px; }
        #gan-e2 { left: 356px; top: 280px; border-top-width: 8px; border-right-width: 8px; border-top-right-radius: 22px; }
        #gan-e3 { left: 46px; top: 590px; border-bottom-width: 8px; border-left-width: 8px; border-bottom-left-radius: 22px; }
        #gan-e4 { left: 356px; top: 590px; border-bottom-width: 8px; border-right-width: 8px; border-bottom-right-radius: 22px; }
        #gan-laser { position: absolute; left: 70px; top: 310px; width: 332px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(240,201,111,0), #F0C96F, rgba(240,201,111,0)); box-shadow: 0 0 24px 6px rgba(240,201,111,0.55); }
        #gan-aviso { position: absolute; left: 60px; right: 60px; top: 710px; padding: 22px 26px; border-radius: 26px; background: rgba(15,12,16,0.86); border: 1.5px solid rgba(217,178,92,0.55); font-family: var(--font-body); font-weight: 700; font-size: 28px; color: #F7F5F2; text-align: center; }
        #gan-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
        #gan-carta { position: absolute; inset: 0; background-image: url('assets/capturas/inicio.jpg'); background-size: 472px auto; background-position: top center; opacity: 0; }
        #gan-onda { position: absolute; left: 196px; top: 430px; width: 80px; height: 80px; border-radius: 50%; border: 5px solid #F0C96F; opacity: 0; }
      </style>

      <div id="root" data-composition-id="gancho" data-width="1080" data-height="1920">
        <div id="gan-pal" data-layout-allow-occlusion><span data-layout-allow-occlusion>Carta</span><span class="oro" data-layout-allow-occlusion>Autor</span></div>
        <div id="gan-esc">
          <div id="gan-movil" data-layout-allow-occlusion>
            <div id="gan-pantalla">
              <div id="gan-camara"></div>
              <div id="gan-qr-wrap">
                <svg viewBox="0 0 21 21" width="100%" height="100%" aria-label="Código QR de mesa">
                  <rect width="21" height="21" fill="#FFFFFF"/>
                  <path fill="#14090E" d="M1,1 h6 v6 h-6 z M2,2 v4 h4 v-4 z M3,3 h2 v2 h-2 z"/>
                  <path fill="#14090E" d="M14,1 h6 v6 h-6 z M15,2 v4 h4 v-4 z M16,3 h2 v2 h-2 z"/>
                  <path fill="#14090E" d="M1,14 h6 v6 h-6 z M2,15 v4 h4 v-4 z M3,16 h2 v2 h-2 z"/>
                  <path fill="#6E0C2B" d="M9,2 h2 v2 h-2 z M11,4 h2 v2 h-2 z M9,6 h2 v3 h-2 z M2,9 h3 v2 h-3 z M7,9 h4 v2 h-4 z M13,9 h2 v2 h-2 z M17,9 h3 v2 h-3 z M9,12 h2 v2 h-2 z M12,12 h3 v2 h-3 z M17,13 h2 v3 h-2 z M10,16 h3 v2 h-3 z M15,16 h2 v3 h-2 z M18,18 h2 v2 h-2 z"/>
                </svg>
              </div>
              <div class="gan-esq" id="gan-e1"></div><div class="gan-esq" id="gan-e2"></div>
              <div class="gan-esq" id="gan-e3"></div><div class="gan-esq" id="gan-e4"></div>
              <div id="gan-laser"></div>
              <div id="gan-aviso">Mesa VIP · Carta de Autor</div>
              <div id="gan-onda"></div>
              <div id="gan-flash"></div>
              <div id="gan-carta"></div>
              <div id="gan-isla"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#gan-movil", { rotationY: -24, rotationX: 10, scale: 0.84, y: 40 }, { rotationY: -8, rotationX: 4, scale: 0.88, y: 0, duration: 2.8, ease: "power2.out" }, 0);
        tl.fromTo("#gan-pal span", { y: 40, rotationX: -70, opacity: 0.35 }, { y: 0, rotationX: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)", stagger: 0.12 }, 0);
        tl.fromTo("#gan-camara", { scale: 1.15, x: 20 }, { scale: 1.0, x: -20, duration: 2.2, ease: "sine.inOut" }, 0);
        tl.fromTo("#gan-qr-wrap", { rotation: -6, scale: 0.92 }, { rotation: 0, scale: 1, duration: 1.4, ease: "power2.out" }, 0);
        tl.fromTo("#gan-laser", { y: 0, opacity: 1 }, { y: 290, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1);
        tl.to("#gan-laser", { opacity: 0, duration: 0.15 }, 1.3);
        tl.fromTo("#gan-e1", { x: -26, y: -26 }, { x: 14, y: 14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#gan-e2", { x: 26, y: -26 }, { x: -14, y: 14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#gan-e3", { x: -26, y: 26 }, { x: 14, y: -14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#gan-e4", { x: 26, y: 26 }, { x: -14, y: -14, duration: 0.35, ease: "back.out(2)" }, 1.25);
        tl.fromTo("#gan-aviso", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.45);
        tl.fromTo("#gan-onda", { y: 280, scale: 0.3, opacity: 1 }, { y: 280, scale: 2.4, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.9);
        tl.fromTo("#gan-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "none" }, 2.1);
        tl.to("#gan-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 2.18);
        tl.fromTo("#gan-carta", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 2.15);
        tl.to("#gan-pal", { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.9);
        window.__timelines["gancho"] = tl;
      </script>
    </template>
  </body>
</html>
